name: PR to main — hooks (shared)

# Reusable workflow that runs on PRs targeting `main`:
#   1. Gather PR context (commits, diff, candidate issue references)
#   2. Generate a Markdown summary via Claude
#   3. Update the PR body with the summary + Closes #N footers
#   4. Post a Teams card with the latest body (opened / ready_for_review only)
#
# Each consumer's `.github/workflows/pr-to-main-hooks.yml` becomes a thin
# shim that calls this with `uses: aretecp/github-actions/.github/workflows/pr-to-main-hooks.yml@v2`.
#
# `@v2`, not `@v1`. This workflow was added in #70, which is v2-era — the `v1`
# moving tag predates the file, so an `@v1` shim resolves to a ref that does not
# contain it. The frozen-`@v1` policy in README applies to
# `load-infisical-secrets` only, not to reusable workflows.
#
# Reviewers are NOT auto-assigned — the PR author requests reviews
# manually so we can match the right person to the change.
#
# The Teams card runs LAST so it sees the auto-generated PR body, not the
# original empty / placeholder one. Step 4 skips drafts and skips
# `synchronize` events (which fire on every push) so we don't re-post
# the card on every commit.
#
# Two authentication paths for ANTHROPIC_API_KEY and
# TEAMS_PR_NOTIFY_WEBHOOK_URL (mutually exclusive):
#
#   1. OIDC (preferred — ZERO caller inputs):
#      The workflow reads `vars.INFISICAL_OIDC_IDENTITY_ID`,
#      `vars.INFISICAL_INTERNAL_PROJECT_SLUG` and
#      `vars.INFISICAL_SHARED_PROJECT_SLUG` from the CALLER's own repo
#      variables (unlike secrets, vars resolve against the caller —
#      verified 2026-07-28, beacon run 30369406219), then loads
#      ANTHROPIC_API_KEY from `lumist-labs-internal/prod/github-actions` and
#      TEAMS_PR_NOTIFY_WEBHOOK_URL from `lumist-labs-shared/prod/teams/pr-notify`.
#
#      ANTHROPIC_API_KEY comes from the shared CI folder, NOT the app's own
#      folder. Apps keep their key for app-runtime use; CI has its own so
#      spend is attributable and revocation is isolated.
#
#      Every `infisical-*` input is an optional OVERRIDE. A consumer that
#      wants the defaults passes no `with:` block at all.
#
#   2. Forwarded secrets (legacy — still works for backward compat):
#      Caller forwards both secrets via `secrets:` block. Used when
#      the caller hasn't migrated to OIDC yet.
#
# Auto-provided to reusable workflows:
#   GITHUB_TOKEN — PR body update + issue lookups
#
# REQUIRED CALLER PERMISSIONS
# ---------------------------
# The job below requests these permissions. GHA reusable workflows can
# only USE permissions the caller has GRANTED — without this block the
# call fails at startup with "is requesting '...', but is only allowed
# '...'". Copy verbatim into the calling shim (at workflow or job level):
#
#   permissions:
#     contents: read
#     pull-requests: write
#     issues: read
#     id-token: write   # only required when using the OIDC auth path

on:
  workflow_call:
    inputs:
      environment:
        description: >-
          Job environment scope. Only needed for env-level secret access on the
          legacy forwarded-secret path. Defaults to none: the OIDC path needs no
          env-scoped secrets, and defaulting to `production` would run this
          inside a deployment environment — where a required reviewer would
          silently block it pending approval.
        required: false
        type: string
        default: ''
      claude-model:
        description: 'Claude model alias for the summary step.'
        required: false
        type: string
        default: claude-sonnet-4-6

      # --- OIDC path (preferred) — every input below is an optional OVERRIDE ---
      # Leave them all unset and the workflow resolves:
      #   identity-id        → vars.INFISICAL_OIDC_IDENTITY_ID      (caller's var)
      #   app-project-slug   → vars.INFISICAL_INTERNAL_PROJECT_SLUG (caller's var)
      #   app-env            → prod
      #   app-path           → /github-actions   (shared CI key, not an app folder)
      #   shared-project-slug→ vars.INFISICAL_SHARED_PROJECT_SLUG   (caller's var)
      #   shared-env         → prod
      #   shared-path        → /teams/pr-notify
      infisical-identity-id:
        description: 'Override the OIDC machine identity UUID. Defaults to the caller''s vars.INFISICAL_OIDC_IDENTITY_ID.'
        required: false
        type: string
        default: ''
      infisical-app-project-slug:
        description: 'Override the Infisical project for ANTHROPIC_API_KEY. Defaults to the caller''s vars.INFISICAL_INTERNAL_PROJECT_SLUG.'
        required: false
        type: string
        default: ''
      infisical-app-env:
        description: 'Override the Infisical environment slug for the app secrets. Defaults to prod.'
        required: false
        type: string
        default: ''
      infisical-app-path:
        description: 'Override the folder holding ANTHROPIC_API_KEY. Defaults to /github-actions — the shared CI key, deliberately not any app''s folder.'
        required: false
        type: string
        default: ''
      infisical-shared-project-slug:
        description: 'Override the Infisical project for TEAMS_PR_NOTIFY_WEBHOOK_URL. Defaults to the caller''s vars.INFISICAL_SHARED_PROJECT_SLUG.'
        required: false
        type: string
        default: ''
      infisical-shared-env:
        description: 'Override the Infisical environment slug for the shared secrets. Defaults to prod.'
        required: false
        type: string
        default: ''
      infisical-shared-path:
        description: 'Infisical path containing TEAMS_PR_NOTIFY_WEBHOOK_URL.'
        required: false
        type: string
        default: /teams/pr-notify

      runner:
        description: >-
          Runner for this job: a GitHub-hosted image name or a self-hosted
          runner label (e.g. `omarchy`). Self-hosted runners that are already
          tailnet nodes are handled by tailscale-connect's join guard.
        required: false
        type: string
        default: ubuntu-latest
    secrets:
      ANTHROPIC_API_KEY:
        description: 'Anthropic API key. Required UNLESS infisical-identity-id is set (then loaded via OIDC).'
        required: false
      TEAMS_PR_NOTIFY_WEBHOOK_URL:
        description: 'Teams Workflow incoming webhook URL. Required UNLESS infisical-identity-id is set (then loaded via OIDC).'
        required: false

# One summary per PR, not one per push. This fires on `synchronize`, so every
# commit pushed to a develop -> main PR was starting a fresh Claude call to
# regenerate the same summary -- pure spend, and only the last one's output
# survives anyway. Cancelling in flight is safe here: the job only rewrites the
# PR body and posts a card, so a superseded run has nothing worth finishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  link-issues:
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}
    # `npm install -g` below assumed a hosted runner: npm preinstalled, HOME
    # writable, a global prefix it may write to. None of that holds once
    # `runner:` names a self-hosted label -- lumios hit `npm: command not found`
    # on every develop -> main promotion, so no issues were linked and no Teams
    # card was posted. setup-node supplies the toolchain; these two point npm's
    # cache and global prefix at the workspace instead of $HOME, which on a
    # self-hosted runner is often a directory the runner user cannot create.
    env:
      npm_config_cache: ${{ github.workspace }}/.npm-cache
      npm_config_prefix: ${{ github.workspace }}/.npm-global
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Load shared infra secrets FIRST so app-project keys (loaded next) can
      # override any collisions. Each load writes to $GITHUB_ENV last-write-wins,
      # so project-specific values are the authoritative layer.
      # Defaults resolved HERE, not in the inputs block — `workflow_call` input
      # defaults cannot hold expressions, so `vars` coalescing happens at the
      # use site. Verified 2026-07-28 (beacon run 30369406219) that `vars`
      # resolve against the CALLER's repo inside a reusable workflow.
      - name: Load TEAMS_PR_NOTIFY_WEBHOOK_URL from Infisical (OIDC)
        if: ${{ (inputs.infisical-identity-id || vars.INFISICAL_OIDC_IDENTITY_ID) != '' }}
        uses: aretecp/github-actions/actions/load-infisical-secrets@v2
        with:
          method: oidc
          identity-id: ${{ inputs.infisical-identity-id || vars.INFISICAL_OIDC_IDENTITY_ID }}
          project-slug: ${{ inputs.infisical-shared-project-slug || vars.INFISICAL_SHARED_PROJECT_SLUG }}
          environment: ${{ inputs.infisical-shared-env || 'prod' }}
          path: ${{ inputs.infisical-shared-path }}

      - name: Load ANTHROPIC_API_KEY from Infisical (OIDC)
        if: ${{ (inputs.infisical-identity-id || vars.INFISICAL_OIDC_IDENTITY_ID) != '' }}
        uses: aretecp/github-actions/actions/load-infisical-secrets@v2
        with:
          method: oidc
          identity-id: ${{ inputs.infisical-identity-id || vars.INFISICAL_OIDC_IDENTITY_ID }}
          project-slug: ${{ inputs.infisical-app-project-slug || vars.INFISICAL_INTERNAL_PROJECT_SLUG }}
          environment: ${{ inputs.infisical-app-env || 'prod' }}
          path: ${{ inputs.infisical-app-path || '/github-actions' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code@latest
          # `npm_config_prefix` moves the global bin off the default PATH, so
          # make it findable for the steps that actually invoke `claude`.
          echo "${{ github.workspace }}/.npm-global/bin" >> "$GITHUB_PATH"

      - name: Gather PR context
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PR_NUMBER=${{ github.event.pull_request.number }}
          REPO=${{ github.repository }}
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}

          # Get all commit messages in this PR
          COMMITS=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/commits" --paginate -q '.[].commit.message')
          echo "$COMMITS" > /tmp/commits.txt

          # Extract issue numbers: filter out merge commits, then grab all #N from the rest
          NON_MERGE=$(echo "$COMMITS" | grep -viE '^Merge (pull request|branch)' || true)
          echo "::group::Non-merge commit lines"
          echo "$NON_MERGE"
          echo "::endgroup::"

          CANDIDATES=$(echo "$NON_MERGE" | grep -oE '#[0-9]+' | sort -t'#' -k2 -n -u | tr -d '#' || true)
          echo "Candidates from commit messages: $CANDIDATES"

          # ── Second source: `Closes #N` in the FEATURE PRs' descriptions ──────
          #
          # The scan above matches Areté's COMMIT convention (`feat: #42 ...`).
          # It cannot see the other convention: GitHub's `Closes #N` in a pull
          # request description. On a `develop` -> `main` flow GitHub never acts
          # on those itself — closing keywords only fire when a PR merges into
          # the DEFAULT branch — and the later promotion does not re-scan them,
          # so those issues stay open indefinitely and get closed by hand.
          #
          # Measured on the aretecp/areteos 1557 promotion: the commit scan above
          # yielded exactly one candidate, which was a PR and correctly dropped,
          # leaving nothing — while PR #1544's body declared 13 issues and #1551
          # declared a 14th.
          #
          # Feature PRs are read from the commit SUBJECTS rather than from
          # `commits/{sha}/pulls`, which would cost one API request per commit
          # (31 on that promotion, on every `synchronize` of the PR). Merge
          # commits carry `Merge pull request #N`, squashes carry `(#N)`. Both
          # approaches were compared on #1557 and returned an identical set.
          # A rebase-merged PR leaves no reference in either place; the commit
          # scan above is the only thing that can catch those.
          SUBJECTS=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/commits" --paginate \
                       -q '.[].commit.message | split("\n")[0]')
          FEATURE_PRS=$(echo "$SUBJECTS" \
            | grep -oE 'Merge pull request #[0-9]+|\(#[0-9]+\)$' \
            | grep -oE '[0-9]+' | sort -n -u || true)
          echo "Feature PRs in this promotion: $(echo $FEATURE_PRS | tr '\n' ' ')"

          # Fenced code blocks and blockquotes are stripped before matching: a PR
          # that *documents* or quotes a `Closes` line — including this repo's own
          # release template — must not have its example acted on. `\s+#` refuses
          # `owner/repo#5`, which would otherwise resolve against THIS repo;
          # cross-repo closes stay manual.
          BODY_CANDIDATES=$(for P in $FEATURE_PRS; do
              gh api "repos/${REPO}/pulls/${P}" --jq '.body // ""' 2>/dev/null \
                | awk '/^[[:space:]]*```/ { f = !f; next } !f' \
                | grep -v '^[[:space:]]*>' \
                | grep -oP '(?i)\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#\K[0-9]+' || true
            done | sort -n -u || true)
          echo "Candidates from PR bodies: $(echo $BODY_CANDIDATES | tr '\n' ' ')"

          # ── Third source: `Closes #N` already sitting in THIS PR's body ──
          #
          # A human can hand-edit the description to add a Closes line for
          # an issue no commit or feature-PR references — legitimate, and
          # worth keeping. It used to be trusted blindly with no `gh issue
          # view` check (see the "Update PR description" step's old
          # EXISTING_CLOSES), so a bogus number pasted into the body — a
          # template copied from another repo, a Linear ticket ID — got
          # echoed back as a real `Closes #N` on every subsequent run
          # forever, since nothing ever re-validated it. Folding it into
          # $CANDIDATES here routes it through the same validation loop as
          # everything else instead of a second, unchecked path.
          gh pr view "$PR_NUMBER" --repo "$REPO" --json body -q '.body // ""' > /tmp/current-body.txt
          EXISTING_CLOSES=$(cat /tmp/current-body.txt \
            | grep -oiE '(closes|close|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#[0-9]+' \
            | grep -oE '#[0-9]+' | tr -d '#' || true)
          echo "Candidates already in PR body: $(echo $EXISTING_CLOSES | tr '\n' ' ')"

          CANDIDATES=$(printf '%s\n%s\n%s\n' "$CANDIDATES" "$BODY_CANDIDATES" "$EXISTING_CLOSES" \
            | grep -v '^[[:space:]]*$' | sort -n -u || true)
          echo "Candidates (union): $(echo $CANDIDATES | tr '\n' ' ')"

          # `gh issue view` prints a title for a PR number too (GitHub's
          # issues API returns PRs) — caught live via an impossible
          # `state: MERGED` on aretecp/lumios#2110. The REST payload's
          # `pull_request` key is the actual filter.
          : > /tmp/issues.txt
          : > /tmp/issue-context.txt
          for NUM in $CANDIDATES; do
            echo "Validating #${NUM}..."
            ISSUE_JSON=$(gh api "repos/${REPO}/issues/${NUM}" 2>/dev/null) || { echo "  -> skipped (not found)"; continue; }
            if echo "$ISSUE_JSON" | jq -e 'has("pull_request")' >/dev/null; then
              echo "  -> skipped (is a PR, not an issue)"
              continue
            fi
            TITLE=$(echo "$ISSUE_JSON" | jq -r '.title')
            echo "  -> found: ${TITLE}"
            echo "$NUM" >> /tmp/issues.txt
            echo "#${NUM}: ${TITLE}" >> /tmp/issue-context.txt
          done
          echo "Final issues: $(cat /tmp/issues.txt | tr '\n' ' ')"

          # Exclude generated artifacts and lockfiles from what we hand to
          # Claude — they bloat the prompt without adding signal. Patterns
          # cover Elixir/Phoenix, Node, and common front-end build outputs.
          DIFF_EXCLUDES=(
            ':(exclude)mix.lock'
            ':(exclude)package-lock.json'
            ':(exclude)mcp_apps/package-lock.json'
            ':(exclude)priv/static/**'
            ':(exclude)priv/mcp_apps/dist/**'
            ':(exclude)assets/vendor/**'
          )

          # Generate the diff stat for the summary
          git diff --stat "${BASE}..${HEAD}" -- "${DIFF_EXCLUDES[@]}" > /tmp/diffstat.txt

          # Generate the full diff for Claude to summarize
          git diff "${BASE}..${HEAD}" -- "${DIFF_EXCLUDES[@]}" > /tmp/full-diff.txt

      - name: Generate PR summary with Claude
        env:
          # OIDC-loaded env.ANTHROPIC_API_KEY wins if present; falls back to
          # forwarded secret for callers that haven't migrated to OIDC yet.
          ANTHROPIC_API_KEY: ${{ env.ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ inputs.claude-model }}
        run: |
          set -euo pipefail

          COMMITS=$(cat /tmp/commits.txt)
          DIFFSTAT=$(cat /tmp/diffstat.txt)
          ISSUES=$(cat /tmp/issue-context.txt)

          cat > /tmp/summary-prompt.txt << 'PROMPTEOF'
          You are writing a PR description for a release PR into main.

          Output exactly this shape:

          ## Summary

          - <bullet> (#42)
          - <bullet> (#43)

          ## Review notes

          - <thing a reviewer must look at>

          HARD RULES ON BULLETS — these matter more than completeness:
          - Maximum 20 words per bullet. Count them. A bullet over 20 words is wrong
            even if everything in it is true.
          - ONE clause. State what changed. Then stop.
          - BANNED: trailing justification clauses. No bullet may contain " — which ",
            " — resolving ", " so that ", " thereby ", " allowing ", " ensuring ".
            If you catch yourself writing one, the material after it either belongs
            in its own bullet or does not belong at all.
          - Start with a verb: Adds / Fixes / Removes / Renames / Reverts.
          - End with the issue number(s) in parentheses, e.g. "(#42)".

          ## Summary: at most 8 bullets, what changed. Not why it is good, not how
          it works internally. If more than 8 things changed, cover the 8 that most
          affect someone deploying this, and add a final bullet "- Plus N smaller
          changes (see commits)".

          ## Review notes: at most 3 bullets — breaking changes, migrations, config
          or secret changes, anything risky. OMIT THE ENTIRE HEADING if there is
          nothing. Never write "None" or "N/A".

          Bad (43 words, three clauses, two banned phrases):
          - Adds CompanyKindGate, a disambiguation step inside CreateInstitutionMini
            that clarifies institution vs. client before any create/request flow —
            writers see "Request institution" while app-admins see "Create
            institution", resolving the confusion that caused contacts to dead-end (#2665)

          Good:
          - Adds an institution-vs-client gate to CreateInstitutionMini (#2665)
          - Writers now see "Request institution"; app-admins see "Create institution" (#2665)

          No preamble, no self-assessment ("successfully", "comprehensive", "robust"),
          no "This PR does...".
          Do NOT include closing keywords (Closes, Fixes, etc.) — those are added separately.
          Output ONLY the markdown, nothing else.
          PROMPTEOF

          cat >> /tmp/summary-prompt.txt << EOF

          --- Commits ---
          ${COMMITS}

          --- Diffstat ---
          ${DIFFSTAT}

          --- Linked Issues ---
          ${ISSUES}

          --- Full Diff ---
          $(head -c 20000 /tmp/full-diff.txt)
          EOF

          # Pipe the prompt via stdin instead of "$(cat ...)" — large PRs
          # (think develop → main release PRs) blow past Linux ARG_MAX when
          # the prompt becomes a command-line arg, which kicks the workflow
          # into the fallback branch and dumps every commit into the card.
          # 20K diff cap above is the secondary safety net.
          if ! claude \
                 --print \
                 --model "$CLAUDE_MODEL" \
                 --max-turns 1 \
                 < /tmp/summary-prompt.txt \
                 > /tmp/summary.md \
             || [ ! -s /tmp/summary.md ]; then
            echo "::warning::Claude summary step failed or returned empty — using minimal fallback"
            {
              echo "## Summary"
              echo
              echo "_(auto-summary unavailable)_"
            } > /tmp/summary.md
          fi

      - name: Update PR description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PR_NUMBER=${{ github.event.pull_request.number }}
          REPO=${{ github.repository }}

          # Reuse the context step's fetch — nothing edits the PR body
          # between these two steps within a single run, so a second
          # `gh pr view` call here would just be spend for spend's sake.
          CURRENT_BODY=$(cat /tmp/current-body.txt)

          SUMMARY=$(cat /tmp/summary.md)

          # /tmp/issues.txt is already the validated set — every number in
          # it, including ones pulled from the PR body itself, passed
          # `gh issue view` in the context step. Nothing here re-scans the
          # body unvalidated.
          ALL_ISSUES=$(sort -n -u /tmp/issues.txt || true)

          # Build Closes lines
          CLOSES_LINES=""
          for ISSUE in $ALL_ISSUES; do
            CLOSES_LINES="${CLOSES_LINES}Closes #${ISSUE}\n"
          done

          # Build the auto-generated sections with markers
          AUTO_SUMMARY="<!-- auto-summary -->\n${SUMMARY}\n<!-- /auto-summary -->"

          AUTO_CLOSES=""
          if [ -n "$CLOSES_LINES" ]; then
            AUTO_CLOSES="<!-- auto-closes -->\n${CLOSES_LINES}<!-- /auto-closes -->"
          fi

          # Strip existing auto-generated sections AND any legacy closes blocks from the body
          CLEAN_BODY=$(printf "%b" "$CURRENT_BODY" \
            | perl -0777 -pe 's/\n*---\n*\n*<!-- auto-summary -->.*?<!-- \/auto-summary -->//gs' \
            | perl -0777 -pe 's/\n*<!-- auto-summary -->.*?<!-- \/auto-summary -->//gs' \
            | perl -0777 -pe 's/\n*<!-- auto-closes -->.*?<!-- \/auto-closes -->//gs' \
            | perl -0777 -pe 's/\n*---\n*\n*(Closes\s+#\d+\n*)+//gis' \
            | perl -0777 -pe 's/\n*(Closes\s+#\d+\n*)+//gis')

          # Trim trailing whitespace/newlines from clean body
          CLEAN_BODY=$(echo "$CLEAN_BODY" | sed -e 's/[[:space:]]*$//')

          # Assemble the new body
          NEW_BODY=""
          if [ -n "$CLEAN_BODY" ]; then
            NEW_BODY="${CLEAN_BODY}\n\n"
          fi

          if [ -n "$AUTO_CLOSES" ]; then
            NEW_BODY="${NEW_BODY}${AUTO_CLOSES}\n\n---\n\n"
          fi

          NEW_BODY="${NEW_BODY}${AUTO_SUMMARY}"

          printf "%b" "$NEW_BODY" > /tmp/pr-body.txt
          gh pr edit "$PR_NUMBER" --repo "$REPO" --body-file /tmp/pr-body.txt

          echo "Updated PR #${PR_NUMBER}"

      - name: Post to Teams (with auto-generated PR body)
        # Same gating as the reviewer step — fires once on PR open / ready,
        # not on every push. Runs AFTER the body update so the card text
        # reflects the AI-generated summary, not the user's placeholder.
        if: |
          !github.event.pull_request.draft &&
          (github.event.action == 'opened' || github.event.action == 'ready_for_review')
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_ADDITIONS: ${{ github.event.pull_request.additions }}
          PR_DELETIONS: ${{ github.event.pull_request.deletions }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OIDC-loaded env.TEAMS_PR_NOTIFY_WEBHOOK_URL wins if present;
          # falls back to forwarded secret for legacy callers.
          WEBHOOK: ${{ env.TEAMS_PR_NOTIFY_WEBHOOK_URL || secrets.TEAMS_PR_NOTIFY_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          # Re-fetch the PR body so we get the AI-generated summary, not
          # the stale snapshot from when the workflow started.
          BODY=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json body -q '.body // ""')

          # Pull just the AI summary section if pr-close-issues steps wrote
          # one — the markers are <!-- auto-summary --> ... <!-- /auto-summary -->.
          # Falls back to the raw body if no marker present (PR opened
          # before the AI step ran on this exact event).
          # `## Summary` is dropped (the card's own title already says what this
          # is); any other h2 — `## Review notes` — becomes bold, because Teams
          # MessageCard does not render `##` and would print the hashes raw.
          if printf '%s' "$BODY" | grep -q '<!-- auto-summary -->'; then
            DESC=$(printf '%s' "$BODY" \
              | sed -n '/<!-- auto-summary -->/,/<!-- \/auto-summary -->/p' \
              | sed '1d;$d' \
              | sed 's/^## *Summary[[:space:]]*$//' \
              | sed -E 's/^## +(.+[^[:space:]])[[:space:]]*$/**\1**/')
          else
            # Strip Closes / Fixes / Resolves lines so they don't show up
            # twice (once here, once in the Closes facts row).
            DESC=$(printf '%s' "$BODY" \
              | sed -E '/^[[:space:]]*(closes|close|closed|fix|fixes|fixed|resolve|resolves|resolved)[[:space:]]+#[0-9]+/Id' \
              | sed -E '/<!--[[:space:]]*auto-(closes|summary)[[:space:]]*-->/,/<!--[[:space:]]*\/auto-(closes|summary)[[:space:]]*-->/d')
          fi

          # Trim leading/trailing whitespace, then truncate.
          DESC=$(printf '%s' "$DESC" | awk 'NF { p=1 } p' | sed -e 's/[[:space:]]*$//')
          if [ -z "$DESC" ]; then
            DESC="_(no description)_"
          elif [ "${#DESC}" -gt 500 ]; then
            DESC="${DESC:0:500}…"
          fi

          # Linked issues — same closing-keyword set the GitHub auto-closer uses.
          LINKED=$(printf '%s' "$BODY" \
            | grep -oiE '(closes|close|closed|fix|fixes|fixed|resolve|resolves|resolved)[[:space:]]+#[0-9]+' \
            | grep -oE '#[0-9]+' \
            | sort -u \
            | paste -sd ', ' - || true)
          [ -z "$LINKED" ] && LINKED="—"

          DIFFSTAT="+${PR_ADDITIONS} −${PR_DELETIONS} across ${PR_CHANGED_FILES} file(s)"

          # Append a markdown link to the description so users get a
          # clickable "View PR" affordance — Teams Workflow webhooks
          # render `potentialAction` buttons inconsistently, but inline
          # markdown links work everywhere. Two-line gap (\n\n) separates
          # it visually from the summary text.
          DESC_WITH_LINK=$(printf '%s\n\n[View PR →](%s)' "$DESC" "$PR_URL")

          # jq builds the payload with proper string escaping — avoids
          # quoting bugs on PR titles or bodies that contain " or backticks.
          PAYLOAD=$(jq -n \
            --arg title "${REPO} · PR #${PR_NUMBER} → ${PR_BASE}" \
            --arg pr_title "$PR_TITLE" \
            --arg activity "opened by **${PR_AUTHOR}**" \
            --arg branches "\`${PR_HEAD}\` → \`${PR_BASE}\`" \
            --arg desc "$DESC_WITH_LINK" \
            --arg diffstat "$DIFFSTAT" \
            --arg linked "$LINKED" \
            --arg url "$PR_URL" \
            '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": "0076D7",
              "summary": $title,
              "title": $title,
              "text": ("**" + $pr_title + "**"),
              "sections": [{
                "activityTitle": $activity,
                "activitySubtitle": $branches,
                "facts": [
                  {"name": "Diff",   "value": $diffstat},
                  {"name": "Closes", "value": $linked}
                ],
                "text": $desc
              }],
              "potentialAction": [{
                "@type": "OpenUri",
                "name": "View PR",
                "targets": [{"os": "default", "uri": $url}]
              }]
            }')

          # Fail loud if the webhook returns non-2xx so config drift
          # (revoked URL, malformed payload) shows up in the workflow run.
          curl -fsS -H 'Content-Type: application/json' \
               -d "$PAYLOAD" "$WEBHOOK"
