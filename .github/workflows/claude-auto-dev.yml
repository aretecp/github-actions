name: Claude Auto-Dev (shared)

# Reusable workflow that autonomously implements a SMALL, already-triaged bug
# and opens a DRAFT pull request for a human to review. Meant to be triggered by
# the `auto-dev` label (applied by the triage bot on bugs ≤2 points). Each
# consumer's `.github/workflows/claude-auto-dev.yml` is a thin shim:
#
#   on:
#     issues:
#       types: [labeled]
#   jobs:
#     auto-dev:
#       if: github.event.label.name == 'auto-dev'
#       uses: aretecp/github-actions/.github/workflows/claude-auto-dev.yml@v2
#       with: { ...infisical inputs... }
#
# Flow: checkout base → Claude implements the fix (system prompt bundled here at
# .claude/prompts/ci-autodev.md) → run the repo's test_commands → commit → push →
# open a DRAFT PR to base → comment on the issue → Teams ping. On ANY failure it
# comments on the issue, swaps the `auto-dev` label for `auto-dev-failed`, and a
# human picks it up. It NEVER auto-merges.
#
# CREDENTIALS (all via Infisical OIDC — nothing stored in the consumer repo):
#   - ANTHROPIC_API_KEY        — app project/path. Runs Claude.
#   - <autodev-token-key>      — app project/path. A fine-grained PAT with
#                                `contents:write` + `pull-requests:write`. Used
#                                for git push + `gh pr create`. The default
#                                GITHUB_TOKEN is insufficient (often read-only)
#                                AND PRs it opens don't trigger the PR's own CI.
#   - TEAMS_PR_NOTIFY_WEBHOOK_URL — shared project/path. Optional; skipped if unset.
#
# REQUIRED CALLER PERMISSIONS (copy verbatim into the shim, job or workflow level):
#   permissions:
#     contents: read
#     issues: write
#     id-token: write

on:
  workflow_call:
    inputs:
      environment:
        description: 'Job environment scope (env-level secret access in private repos).'
        required: false
        type: string
        default: production
      base-branch:
        description: 'Branch to fix on and open the draft PR against.'
        required: false
        type: string
        default: develop
      shared-ref:
        description: 'Ref of aretecp/github-actions to pull the system prompt from.'
        required: false
        type: string
        default: v2
      claude-model:
        description: 'Claude model alias for the implementation step.'
        required: false
        type: string
        default: claude-sonnet-4-6
      max-turns:
        description: 'Max agent turns for the implementation step.'
        required: false
        type: number
        default: 40
      autodev-token-key:
        description: 'Name of the env var (loaded from the app Infisical path) holding the push/PR PAT.'
        required: false
        type: string
        default: AUTODEV_GITHUB_TOKEN

      # --- Infisical OIDC (app project: ANTHROPIC_API_KEY + the PAT) ---
      infisical-identity-id:
        description: 'Infisical OIDC machine identity UUID.'
        required: true
        type: string
      infisical-app-project-slug:
        description: 'Infisical project holding ANTHROPIC_API_KEY + the PAT (e.g. arete-internal).'
        required: true
        type: string
      infisical-app-env:
        description: 'Infisical environment slug for app secrets (dev/prod).'
        required: true
        type: string
      infisical-app-path:
        description: 'Infisical path holding ANTHROPIC_API_KEY + the PAT (e.g. /bd-pulse).'
        required: true
        type: string

      # --- Infisical OIDC (shared project: Teams webhook) — optional ---
      infisical-shared-project-slug:
        description: 'Infisical project for TEAMS_PR_NOTIFY_WEBHOOK_URL.'
        required: false
        type: string
        default: arete-shared
      infisical-shared-env:
        description: 'Infisical environment slug for shared secrets.'
        required: false
        type: string
        default: ''
      infisical-shared-path:
        description: 'Infisical path for TEAMS_PR_NOTIFY_WEBHOOK_URL.'
        required: false
        type: string
        default: /teams/pr-notify

jobs:
  auto-dev:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base-branch }}
          fetch-depth: 0

      - name: Checkout shared assets (system prompt)
        uses: actions/checkout@v4
        with:
          repository: aretecp/github-actions
          ref: ${{ inputs.shared-ref }}
          path: .shared-actions

      - name: Load app secrets from Infisical (OIDC)
        uses: aretecp/github-actions/actions/load-infisical-secrets@v2
        with:
          method: oidc
          identity-id: ${{ inputs.infisical-identity-id }}
          project-slug: ${{ inputs.infisical-app-project-slug }}
          environment: ${{ inputs.infisical-app-env }}
          path: ${{ inputs.infisical-app-path }}

      - name: Load Teams webhook from Infisical (OIDC)
        if: inputs.infisical-shared-env != ''
        uses: aretecp/github-actions/actions/load-infisical-secrets@v2
        with:
          method: oidc
          identity-id: ${{ inputs.infisical-identity-id }}
          project-slug: ${{ inputs.infisical-shared-project-slug }}
          environment: ${{ inputs.infisical-shared-env }}
          path: ${{ inputs.infisical-shared-path }}

      - name: Resolve push/PR token
        id: token
        run: |
          set -euo pipefail
          # The PAT was loaded into the env under the caller-named key.
          TOKEN="${!AUTODEV_KEY:-}"
          if [ -z "$TOKEN" ]; then
            echo "::error::Push/PR token '${AUTODEV_KEY}' not found at the app Infisical path. Provision a fine-grained PAT (contents:write + pull-requests:write)."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
        env:
          AUTODEV_KEY: ${{ inputs.autodev-token-key }}

      - name: Configure git identity + auth
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "arete-autodev[bot]"
          git config user.email "autodev@aretecp.com"
          # Authenticate git pushes with the PAT.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Get issue info
        id: issue
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          NUMBER=${{ github.event.issue.number }}
          TITLE=$(gh issue view "$NUMBER" --json title -q .title)
          gh issue view "$NUMBER" --json body -q .body > /tmp/issue-body.txt
          # slug: lowercased title, non-alnum → dash, trimmed, capped
          SLUG=$(printf '%s' "$TITLE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-40)
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "branch=bugfix/${NUMBER}-${SLUG}" >> "$GITHUB_OUTPUT"

      - name: Acknowledge (👀 on issue)
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: gh api "repos/${{ github.repository }}/issues/${{ steps.issue.outputs.number }}/reactions" -f content=eyes || true

      - name: Create working branch
        run: git checkout -b "${{ steps.issue.outputs.branch }}"

      - name: Build implement prompt
        run: |
          {
            echo "Implement the fix for issue #${{ steps.issue.outputs.number }}: ${{ steps.issue.outputs.title }}"
            echo ""
            echo "Issue body:"
            cat /tmp/issue-body.txt
            echo ""
            echo "The repository is checked out at $(pwd) on branch ${{ steps.issue.outputs.branch }} (based on ${{ inputs.base-branch }}). Read CLAUDE.md for Project Config (test_commands, build_commands) and follow the system prompt."
          } > /tmp/autodev-prompt.txt

      - name: Run Claude (implement)
        env:
          ANTHROPIC_API_KEY: ${{ env.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ inputs.claude-model }}
          MAX_TURNS: ${{ inputs.max-turns }}
        run: |
          set -euo pipefail
          echo "Claude version: $(claude --version)"
          claude \
            --print \
            --model "$CLAUDE_MODEL" \
            --system-prompt-file .shared-actions/.claude/prompts/ci-autodev.md \
            --max-turns "$MAX_TURNS" \
            --permission-mode bypassPermissions \
            --verbose \
            < /tmp/autodev-prompt.txt \
            > /tmp/autodev-output.md
          if [ ! -s /tmp/autodev-output.md ]; then
            echo "## Summary" > /tmp/autodev-output.md
            echo "_(no summary produced)_" >> /tmp/autodev-output.md
          fi
          echo "::group::Claude output"; cat /tmp/autodev-output.md; echo "::endgroup::"

      - name: Detect changes
        id: changes
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: No changes — bail out to a human
        if: steps.changes.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          gh issue comment "${{ steps.issue.outputs.number }}" --body "🤖 Auto-dev made no code changes — this needs a human. See the run log.

          $(cat /tmp/autodev-output.md)"
          gh issue edit "${{ steps.issue.outputs.number }}" --remove-label auto-dev --add-label auto-dev-failed || true
          echo "::notice::No changes produced; handed back to a human."
          exit 1

      - name: Commit + push
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          git add -A
          git commit -m "fix: #${{ steps.issue.outputs.number }} ${{ steps.issue.outputs.title }}"
          git push -u origin "${{ steps.issue.outputs.branch }}"

      - name: Open draft PR
        id: pr
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          {
            echo "Closes #${{ steps.issue.outputs.number }}"
            echo ""
            cat /tmp/autodev-output.md
            echo ""
            echo "---"
            echo "🤖 Autonomous draft by auto-dev — **needs human review before merge.** Tests were run in the implement step; CI will re-run on this PR."
          } > /tmp/pr-body.txt
          URL=$(gh pr create \
            --draft \
            --base "${{ inputs.base-branch }}" \
            --head "${{ steps.issue.outputs.branch }}" \
            --title "fix: #${{ steps.issue.outputs.number }} ${{ steps.issue.outputs.title }}" \
            --body-file /tmp/pr-body.txt)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          gh issue comment "${{ steps.issue.outputs.number }}" --body "🤖 Opened draft PR: ${URL}"

      - name: Teams ping (draft ready for review)
        if: steps.changes.outputs.changed == 'true' && env.TEAMS_PR_NOTIFY_WEBHOOK_URL != ''
        env:
          WEBHOOK: ${{ env.TEAMS_PR_NOTIFY_WEBHOOK_URL }}
          PR_URL: ${{ steps.pr.outputs.url }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ steps.issue.outputs.number }}
          TITLE: ${{ steps.issue.outputs.title }}
        run: |
          set -euo pipefail
          PAYLOAD=$(jq -n \
            --arg title "${REPO} · 🤖 auto-dev draft PR" \
            --arg text "**${TITLE}**" \
            --arg activity "Autonomous fix for issue #${ISSUE} — needs review" \
            --arg url "$PR_URL" \
            '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "themeColor": "6f42c1",
              "summary": $title,
              "title": $title,
              "text": $text,
              "sections": [{"activityTitle": $activity, "text": ("[Review draft PR →](" + $url + ")")}],
              "potentialAction": [{"@type": "OpenUri", "name": "Review PR", "targets": [{"os": "default", "uri": $url}]}]
            }')
          curl -fsS -H 'Content-Type: application/json' -d "$PAYLOAD" "$WEBHOOK"

      - name: On failure — hand back to a human
        if: failure()
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "🤖 Auto-dev failed — see the [run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Handing this to a human (\`/work-issue ${{ github.event.issue.number }}\`)." || true
          gh issue edit "${{ github.event.issue.number }}" --remove-label auto-dev --add-label auto-dev-failed || true
