name: Entra Secret Detector

# Daily read-only scan of every app registration in the Entra tenant, reporting
# any credential nearing expiry.
#
# Exists because on 2026-07-29 arilearn prod auth broke on AADSTS7000222 — an
# expired client secret that had been created by hand in the portal, tracked by
# nothing, with no system watching it. Every Terraform-managed secret is on a
# 365-day fuse with `ignore_changes = [end_date]`, so `terraform plan` never
# warns either.
#
# Design notes:
#   * Reads GRAPH, not Infisical. Graph is the source of truth and sees
#     credentials Terraform never created — precisely the arilearn failure mode.
#     An Infisical-based check only ever sees what Terraform already knows about.
#   * Auth is GitHub OIDC federation against the `Entra Secret Monitor` app,
#     which has NO client secret. A credential-expiry watchdog holding an
#     expiring credential dies exactly the death it exists to prevent.
#   * SILENT when nothing is in window. No issue, no notification, job summary
#     only. A job that's green 360 days a year is a job nobody reads; the fix is
#     silence, not a lower frequency.
#   * Read-only. The monitor identity holds Application.Read.All and cannot mint,
#     modify, or delete a credential. The write path is Terraform's.
#
# Schedule rationale: 13:00 UTC puts any resulting action at the start of the US
# workday. The `:17` avoids the top-of-hour congestion peak, where scheduled
# workflows get delayed or dropped entirely.
#
# See docs/features/entra-secret-rotation/PLAN.md in
# aretecp/microsoft-entra-terraform-infrastructure.

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
    inputs:
      window-days:
        description: 'Report credentials expiring within this many days.'
        required: false
        type: string
        default: '30'
      dry-run:
        description: 'Report to the job summary only — never touch issues.'
        required: false
        type: boolean
        default: false

# No `environment:` — this workflow consumes no environment-scoped secrets. Auth
# is OIDC (no stored secret) and issue management uses the auto-provided
# GITHUB_TOKEN. See the env-scoping rule in CONTRIBUTING.md: the line is required
# only when reading env-level `secrets.*`.
permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: entra-secret-detector
  cancel-in-progress: false

env:
  WINDOW_DAYS: ${{ inputs.window-days || '30' }}
  ISSUE_LABEL: entra-secret-expiry

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Two-legged exchange: GitHub mints a short-lived OIDC JWT for this run,
      # Entra accepts it as a client_assertion in place of a client secret.
      # Nothing long-lived is stored anywhere.
      # The Terraform workspace publishes every app's MICROSOFT_* values to
      # /<app-slug>/, so the monitor's identity is resolved the same way as any
      # other app's rather than through bespoke repo variables. The monitor has
      # no MICROSOFT_CLIENT_SECRET — there is nothing to expire, which is the
      # entire point of a credential watchdog.
      - name: Load monitor identity from Infisical
        uses: ./actions/load-infisical-secrets
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_OIDC_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_INTERNAL_PROJECT_SLUG }}
          environment: prod
          path: /entra-secret-monitor

      - name: Exchange GitHub OIDC token for a Graph token
        env:
          TENANT_ID: ${{ env.MICROSOFT_TENANT_ID }}
          CLIENT_ID: ${{ env.MICROSOFT_CLIENT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${TENANT_ID:-}" ] || [ -z "${CLIENT_ID:-}" ]; then
            echo "::error::MICROSOFT_CLIENT_ID / MICROSOFT_TENANT_ID were not loaded from Infisical."
            echo "::error::Expected at /entra-secret-monitor (prod) in the internal project."
            echo "::error::Apply the Terraform first — module.entra_secret_monitor publishes them."
            exit 1
          fi

          GH_JWT=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api%3A%2F%2FAzureADTokenExchange" \
            | jq -r '.value')

          RESPONSE=$(curl -sS -X POST \
            "https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token" \
            -d 'grant_type=client_credentials' \
            -d 'scope=https://graph.microsoft.com/.default' \
            -d 'client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer' \
            -d "client_id=${CLIENT_ID}" \
            --data-urlencode "client_assertion=${GH_JWT}")

          TOKEN=$(printf '%s' "$RESPONSE" | jq -r '.access_token // ""')

          if [ -z "$TOKEN" ]; then
            echo "::error::Token exchange failed."
            # AADSTS700213 = no federated identity record matched this run's
            # subject. The credential is pinned to refs/heads/main, so this is
            # the expected failure when testing from a branch.
            printf '%s' "$RESPONSE" | jq -r '"\(.error): \(.error_description)"' | head -5
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          # Via file, not step output — keeps the token out of the workflow
          # output context entirely.
          umask 077
          printf '%s' "$TOKEN" > "${RUNNER_TEMP}/graph_token"

      - name: Scan tenant credentials
        run: |
          set -euo pipefail
          GRAPH_TOKEN="$(cat "${RUNNER_TEMP}/graph_token")" \
            ./scripts/entra-credential-scan.sh > "${RUNNER_TEMP}/scan.json"
          echo "Found $(jq 'length' "${RUNNER_TEMP}/scan.json") credential(s) with an expiry."

      - name: Render report
        id: report
        run: |
          set -euo pipefail
          SCAN="${RUNNER_TEMP}/scan.json"

          EXPIRED=$(jq '[.[] | select(.days_left < 0)]' "$SCAN")
          IN_WINDOW=$(jq --argjson w "$WINDOW_DAYS" '[.[] | select(.days_left >= 0 and .days_left <= $w)]' "$SCAN")
          # Scoped to actionable ones — an ALREADY EXPIRED unmanaged credential is
          # the single most important case (it is literally the arilearn outage),
          # so this must not filter on days_left >= 0. Long-dead credentials on
          # retired apps would just be noise, hence the window bound.
          ORPHANS=$(jq --argjson w "$WINDOW_DAYS" '[.[] | select(.terraform_managed == false and .days_left <= $w)]' "$SCAN")

          n_expired=$(printf '%s' "$EXPIRED"   | jq 'length')
          n_window=$(printf '%s'  "$IN_WINDOW" | jq 'length')
          n_orphan=$(printf '%s'  "$ORPHANS"   | jq 'length')

          {
            echo "n_expired=${n_expired}"
            echo "n_window=${n_window}"
            echo "n_orphan=${n_orphan}"
          } >> "$GITHUB_OUTPUT"

          # State fingerprint for transition detection. Includes each in-window
          # credential's key_id AND whether it has expired, so "12 days left" →
          # "expired" counts as a change and re-notifies. Without this the
          # workflow would either post daily (channel gets muted, which defeats
          # the whole point) or never re-post when a situation worsens.
          STATE=$(jq -r --argjson w "$WINDOW_DAYS" '
            [.[] | select(.days_left <= $w) | "\(.key_id):\(.days_left < 0)"]
            | sort | join(",")
          ' "$SCAN" | shasum -a 256 | cut -c1-16)
          echo "state=${STATE}" >> "$GITHUB_OUTPUT"

          # Markdown table, reused verbatim for both the job summary and the
          # issue body so the two can never disagree.
          {
            echo "## Entra credential expiry"
            echo
            echo "Window: **${WINDOW_DAYS} days**. Expired: **${n_expired}**. In window: **${n_window}**."
            echo

            if [ "$n_expired" -gt 0 ] || [ "$n_window" -gt 0 ]; then
              echo "| Days | App | Credential | Kind | Expires | Managed by TF |"
              echo "|---:|---|---|---|---|:---:|"
              jq -r --argjson w "$WINDOW_DAYS" '
                .[] | select(.days_left <= $w)
                | "| \(if .days_left < 0 then "**EXPIRED**" else .days_left end) | \(.app) | `\(.name)` | \(.kind) | \(.expires[0:10]) | \(if .terraform_managed then "yes" else "**no**" end) |"
              ' "$SCAN"
              echo
            else
              echo "Nothing expiring inside the window."
              echo
            fi

            if [ "$n_orphan" -gt 0 ]; then
              echo "### Credentials Terraform does not manage (${n_orphan})"
              echo
              echo "Not named \`terraform-managed-*\`, so they were created out of band and"
              echo "**cannot be rotated by the pipeline**. This is the class of credential that"
              echo "broke arilearn. Either bring them under Terraform or retire them."
              echo
              jq -r '.[] | "- **\(.app)** — `\(.name)` (\(.kind)), expires \(.expires[0:10]), \(.days_left)d"' <<<"$ORPHANS"
              echo
            fi

            echo "<sub>Read-only scan via Microsoft Graph. Source of truth is Graph, not"
            echo "Infisical — this is what catches credentials Terraform never created.</sub>"
            # Machine-readable marker: lets the next run tell "same situation,
            # edit quietly" from "something changed, speak up".
            echo "<!-- detector-state: ${STATE} -->"
          } > "${RUNNER_TEMP}/report.md"

          cat "${RUNNER_TEMP}/report.md" >> "$GITHUB_STEP_SUMMARY"

      # Deliberately silent when nothing is in window — no issue is opened, and
      # any existing one is closed. Daily runs must not accumulate 30 duplicate
      # issues, so a single labelled issue is reused and edited in place.
      - name: Open or update tracking issue
        id: issue
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          N_EXPIRED: ${{ steps.report.outputs.n_expired }}
          N_WINDOW: ${{ steps.report.outputs.n_window }}
          STATE: ${{ steps.report.outputs.state }}
        run: |
          set -euo pipefail

          gh label create "$ISSUE_LABEL" \
            --description 'Entra credential nearing or past expiry' \
            --color 'B60205' 2>/dev/null || true

          EXISTING=$(gh issue list \
            --label "$ISSUE_LABEL" --state open --limit 1 \
            --json number,body -q '.[0].number // ""')

          if [ "$N_EXPIRED" -eq 0 ] && [ "$N_WINDOW" -eq 0 ]; then
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" \
                --comment "All Entra credentials are now outside the ${WINDOW_DAYS}-day window. Closing automatically."
              echo "Closed #${EXISTING} — nothing in window."
              echo "notify=resolved" >> "$GITHUB_OUTPUT"
            else
              echo "Nothing in window, no open issue. Staying silent."
              echo "notify=none" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if [ "$N_EXPIRED" -gt 0 ]; then
            TITLE="Entra credentials: ${N_EXPIRED} EXPIRED, ${N_WINDOW} expiring soon"
          else
            TITLE="Entra credentials: ${N_WINDOW} expiring within ${WINDOW_DAYS} days"
          fi

          if [ -n "$EXISTING" ]; then
            # Compare against the marker embedded in the existing body. Same
            # state → edit quietly. Changed → the situation moved, so speak up.
            PREV=$(gh issue view "$EXISTING" --json body -q '.body' \
                   | sed -n 's/.*<!-- detector-state: \([a-f0-9]*\) -->.*/\1/p' | head -1)
            gh issue edit "$EXISTING" --title "$TITLE" --body-file "${RUNNER_TEMP}/report.md"
            echo "Updated #${EXISTING}."
            echo "issue=${EXISTING}" >> "$GITHUB_OUTPUT"

            if [ "$PREV" = "$STATE" ]; then
              echo "State unchanged (${STATE}) — editing quietly, no Teams post."
              echo "notify=none" >> "$GITHUB_OUTPUT"
            else
              echo "State changed (${PREV:-none} → ${STATE}) — will notify."
              echo "notify=changed" >> "$GITHUB_OUTPUT"
            fi
          else
            NEW=$(gh issue create --title "$TITLE" \
              --body-file "${RUNNER_TEMP}/report.md" \
              --label "$ISSUE_LABEL")
            echo "Opened ${NEW}."
            echo "issue=${NEW##*/}" >> "$GITHUB_OUTPUT"
            echo "notify=changed" >> "$GITHUB_OUTPUT"
          fi

      # Reaches the channel the team already watches. A GitHub issue nobody has
      # open is not a notification.
      #
      # Fires only when the situation CHANGED (new credential in window, or one
      # tipped over into expired) — never on a timer. A daily "still expiring"
      # post trains people to mute the channel, which defeats the purpose.
      #
      # This is also the dead-man's switch for the rotation pipeline: the message
      # says what is about to happen, so SILENCE AFTERWARDS is itself the alarm.
      # That only works if a broken notifier is loud, which is why teams-notify
      # fails the step on a non-2xx webhook response.
      - name: Load Teams webhook
        if: ${{ steps.issue.outputs.notify == 'changed' || steps.issue.outputs.notify == 'resolved' }}
        uses: ./actions/load-infisical-secrets
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_OIDC_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_SHARED_PROJECT_SLUG }}
          environment: prod
          path: /teams/pr-notify

      - name: Notify Teams — credentials need rotating
        if: ${{ steps.issue.outputs.notify == 'changed' }}
        uses: ./actions/teams-notify
        env:
          TEAMS_WEBHOOK_URL: ${{ env.TEAMS_PR_NOTIFY_WEBHOOK_URL }}
        with:
          title: >-
            ${{ steps.report.outputs.n_expired != '0'
                && format('{0} Entra credential(s) EXPIRED', steps.report.outputs.n_expired)
                || format('{0} Entra credential(s) expiring within {1} days', steps.report.outputs.n_window, env.WINDOW_DAYS) }}
          status: ${{ steps.report.outputs.n_expired != '0' && 'failure' || 'warning' }}
          text: |
            ${{ steps.report.outputs.n_expired != '0'
                && 'A credential has **already expired** — something may be failing in production now.'
                || 'Rotation is due. Full breakdown, including which credentials Terraform cannot rotate, is in the tracking issue.' }}

            Posted on change only — you will not get a repeat of this tomorrow if the situation is unchanged.
          facts: >-
            [{"name":"Expired","value":"${{ steps.report.outputs.n_expired }}"},
             {"name":"In window","value":"${{ steps.report.outputs.n_window }}"},
             {"name":"Not TF-managed","value":"${{ steps.report.outputs.n_orphan }}"}]
          button-url: ${{ github.server_url }}/${{ github.repository }}/issues/${{ steps.issue.outputs.issue }}
          button-label: View tracking issue

      - name: Notify Teams — all clear
        if: ${{ steps.issue.outputs.notify == 'resolved' }}
        uses: ./actions/teams-notify
        env:
          TEAMS_WEBHOOK_URL: ${{ env.TEAMS_PR_NOTIFY_WEBHOOK_URL }}
        with:
          title: Entra credentials all clear
          status: success
          text: >-
            Every credential is now outside the ${{ env.WINDOW_DAYS }}-day window.
            Closing the tracking issue.

      # An already-expired credential means something is broken in prod right
      # now, not approaching a deadline. Fail the run so it surfaces as a red
      # workflow rather than only as an issue edit.
      - name: Fail on expired credentials
        if: ${{ steps.report.outputs.n_expired != '0' }}
        run: |
          echo "::error::${{ steps.report.outputs.n_expired }} Entra credential(s) have already expired — see the job summary."
          exit 1
