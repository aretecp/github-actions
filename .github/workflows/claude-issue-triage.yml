name: Claude Issue Triage (shared)

# Reusable workflow that runs Claude Code on a freshly opened issue (or
# `@claude` comment) to triage it: post a triage report comment, suggest
# labels, suggest a branch name. Each consumer's
# `.github/workflows/claude-issues.yml` becomes a thin shim.
#
# The system prompt is bundled in this repo at .claude/prompts/ci-triage.md
# so it stays in sync across all consumers automatically — bump the prompt
# here, all consumers pick it up on the next workflow run.
#
# Two authentication paths for ANTHROPIC_API_KEY (mutually exclusive):
#
#   1. OIDC (preferred — ZERO caller inputs):
#      The workflow reads `vars.INFISICAL_OIDC_IDENTITY_ID` and
#      `vars.INFISICAL_INTERNAL_PROJECT_SLUG` from the CALLER's own org/repo
#      variables (unlike secrets, vars resolve against the caller — verified
#      2026-07-28, beacon run 30369406219), then loads ANTHROPIC_API_KEY from
#      `lumist-labs-internal/prod/github-actions` via a short-lived GitHub OIDC
#      token at run time.
#
#      That folder is the shared CI key location — deliberately NOT any app's
#      folder. Apps keep their own ANTHROPIC_API_KEY for app-runtime use; CI
#      gets its own key so spend is attributable and revocation is isolated.
#
#      Every `infisical-*` input below is an optional OVERRIDE. A consumer
#      that wants the defaults passes no `with:` block at all.
#
#   2. Forwarded secret (legacy — still works for backward compat):
#      Caller forwards ANTHROPIC_API_KEY via `secrets:` block. Used when
#      the caller hasn't migrated to OIDC yet.
#
# Auto-provided to reusable workflows:
#   GITHUB_TOKEN — issue comment + label updates
#
# REQUIRED CALLER PERMISSIONS
# ---------------------------
# The job below requests these permissions. GHA reusable workflows can
# only USE permissions the caller has GRANTED — without this block the
# call fails at startup with "is requesting '...', but is only allowed
# '...'". Copy verbatim into the calling shim (at workflow or job level):
#
#   permissions:
#     contents: read
#     issues: write
#     id-token: write   # only required when using the OIDC auth path
#
# MINIMAL CONSUMER SHIM (the whole thing)
# ---------------------------------------
#   name: Claude Issue Triage
#   on:
#     issues:
#       types: [opened]
#     issue_comment:
#       types: [created]
#   permissions:
#     contents: read
#     issues: write
#     id-token: write
#   jobs:
#     triage:
#       uses: aretecp/github-actions/.github/workflows/claude-issue-triage.yml@v2

on:
  workflow_call:
    inputs:
      environment:
        description: >-
          Job environment scope. Only needed for env-level secret access on the
          legacy forwarded-secret path. Defaults to none: the OIDC path needs no
          env-scoped secrets, and defaulting to `production` would run triage
          inside a deployment environment — where any required reviewer would
          silently block it pending approval.
        required: false
        type: string
        default: ''
      checkout-ref:
        description: >-
          Ref to check out from the consumer repo for Claude to analyze.
          Defaults to the consumer's own default branch, so repos on develop or
          master work without configuration.
        required: false
        type: string
        default: ''
      shared-ref:
        description: >-
          Ref of aretecp/github-actions to pull the system prompt from.
          MUST track this workflow's own major tag — it defaulted to `v1` while
          consumers called `@v2`, so they ran v2 logic against a frozen v1
          prompt. Bump this default in lockstep with every major release.
          (There is no expression context for a reusable workflow's own ref:
          `job_workflow_sha` is an OIDC claim, not a `github` context property.)
        required: false
        type: string
        default: v2
      claude-model:
        description: 'Claude model alias.'
        required: false
        type: string
        default: claude-sonnet-4-6

      # --- OIDC path (preferred) — all four are optional OVERRIDES ---
      # Leave every one unset and the workflow resolves:
      #   identity-id  → vars.INFISICAL_OIDC_IDENTITY_ID     (caller's org var)
      #   project-slug → vars.INFISICAL_INTERNAL_PROJECT_SLUG (caller's org var)
      #   env          → prod
      #   path         → /github-actions
      infisical-identity-id:
        description: 'Override the OIDC machine identity UUID. Defaults to the caller''s vars.INFISICAL_OIDC_IDENTITY_ID.'
        required: false
        type: string
        default: ''
      infisical-project-slug:
        description: 'Override the Infisical project. Defaults to the caller''s vars.INFISICAL_INTERNAL_PROJECT_SLUG.'
        required: false
        type: string
        default: ''
      infisical-env:
        description: 'Override the Infisical environment slug. Defaults to prod.'
        required: false
        type: string
        default: ''
      infisical-path:
        description: 'Override the Infisical folder holding ANTHROPIC_API_KEY. Defaults to /github-actions (the shared CI key, not any app''s folder).'
        required: false
        type: string
        default: ''

      runner:
        description: >-
          Runner for this job: a GitHub-hosted image name or a self-hosted
          runner label (e.g. `omarchy`). Self-hosted runners that are already
          tailnet nodes are handled by tailscale-connect's join guard.
        required: false
        type: string
        default: ubuntu-latest
    secrets:
      ANTHROPIC_API_KEY:
        description: 'Anthropic API key. Required UNLESS infisical-identity-id is set (then loaded via OIDC).'
        required: false

jobs:
  triage:
    if: |
      (github.event_name == 'issues') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Checkout consumer repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout-ref || github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Checkout shared workflow assets (for system prompt)
        uses: actions/checkout@v4
        with:
          repository: aretecp/github-actions
          # Public repo, so no token needed. See the shared-ref input: this must
          # track the workflow's own major tag.
          ref: ${{ inputs.shared-ref }}
          path: .shared-actions

      # Defaults are resolved HERE, not in the inputs block — `workflow_call`
      # input defaults can't hold expressions, so `vars` / `github` context
      # coalescing has to happen at the use site.
      - name: Load ANTHROPIC_API_KEY from Infisical (OIDC)
        if: ${{ (inputs.infisical-identity-id || vars.INFISICAL_OIDC_IDENTITY_ID) != '' }}
        uses: aretecp/github-actions/actions/load-infisical-secrets@v2
        with:
          method: oidc
          identity-id: ${{ inputs.infisical-identity-id || vars.INFISICAL_OIDC_IDENTITY_ID }}
          project-slug: ${{ inputs.infisical-project-slug || vars.INFISICAL_INTERNAL_PROJECT_SLUG }}
          environment: ${{ inputs.infisical-env || 'prod' }}
          path: ${{ inputs.infisical-path || '/github-actions' }}

      # Fail fast with an actionable message rather than letting Claude die on an
      # opaque auth error 60 seconds later. The likely cause in a newly-onboarded
      # repo is that the org variable isn't visible to it.
      - name: Verify an API key resolved
        env:
          FORWARDED_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "ANTHROPIC_API_KEY resolved via Infisical OIDC."
          elif [ -n "$FORWARDED_KEY" ]; then
            echo "ANTHROPIC_API_KEY resolved via forwarded secret (legacy path)."
          else
            echo "::error::No ANTHROPIC_API_KEY available. For the OIDC path this repo needs: (1) the org variable INFISICAL_OIDC_IDENTITY_ID visible to it — check the 'selected repositories' list, (2) the OIDC identity trusted for this repo, and (3) read access on lumist-labs-internal/<env>/github-actions. Otherwise forward ANTHROPIC_API_KEY via the caller's secrets block."
            exit 1
          fi

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Acknowledge trigger
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            gh api repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions -f content=eyes
          else
            gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/reactions -f content=eyes
          fi

      - name: Get issue info
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NUMBER=${{ github.event.issue.number }}
          TITLE=$(gh issue view $NUMBER --json title -q .title)
          BODY=$(gh issue view $NUMBER --json body -q .body)
          echo "number=$NUMBER" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "$BODY" > /tmp/issue-body.txt

      - name: Build triage prompt
        run: |
          ISSUE_BODY=$(cat /tmp/issue-body.txt)
          ISSUE_NUM="${{ steps.issue.outputs.number }}"
          ISSUE_TITLE="${{ steps.issue.outputs.title }}"

          {
            echo "Triage issue #${ISSUE_NUM}: ${ISSUE_TITLE}"
            echo ""
            echo "Issue body:"
            echo "$ISSUE_BODY"
            echo ""
            echo "Repository is checked out at $(pwd). Analyze the codebase, then:"
            echo "1. Analyze and produce your triage report"
            echo "2. Add labels with: gh issue edit ${ISSUE_NUM} --add-label <label>"
            echo "3. Estimate difficulty points (Fibonacci: 1,2,3,5,8,13) based on scope and complexity"
            echo "4. Suggest a branch name in the report (do NOT create the branch — /work-issue creates it)"
          } > /tmp/triage-prompt.txt

          echo "::group::Triage prompt"
          cat /tmp/triage-prompt.txt
          echo "::endgroup::"

          echo "::group::System prompt"
          cat .shared-actions/.claude/prompts/ci-triage.md
          echo "::endgroup::"

      - name: Run Claude triage
        env:
          # OIDC-loaded env.ANTHROPIC_API_KEY wins if present; falls back to
          # forwarded secret for callers that haven't migrated to OIDC yet.
          ANTHROPIC_API_KEY: ${{ env.ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_MODEL: ${{ inputs.claude-model }}
        run: |
          echo "Claude version: $(claude --version)"
          echo "Starting triage for issue #${{ steps.issue.outputs.number }}..."

          # Pipe via stdin instead of "$(cat ...)" — substituting the file
          # content as a positional arg trips Linux ARG_MAX on large issue
          # bodies.
          claude \
            --print \
            --model "$CLAUDE_MODEL" \
            --system-prompt-file .shared-actions/.claude/prompts/ci-triage.md \
            --max-turns 20 \
            --permission-mode bypassPermissions \
            --verbose \
            < /tmp/triage-prompt.txt \
            2>/tmp/triage-stderr.log \
            > /tmp/triage-output.md

          EXIT_CODE=$?
          echo "Claude exit code: ${EXIT_CODE}"

          echo "::group::Claude stderr"
          cat /tmp/triage-stderr.log || true
          echo "::endgroup::"

          echo "::group::Triage output"
          cat /tmp/triage-output.md
          echo "::endgroup::"

          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Claude triage failed with exit code ${EXIT_CODE}"
            exit 1
          fi

          if [ ! -s /tmp/triage-output.md ]; then
            echo "::error::Claude produced empty output"
            exit 1
          fi

      - name: Comment on issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Posting triage comment to issue #${{ steps.issue.outputs.number }}..."
          gh issue comment ${{ steps.issue.outputs.number }} --body-file /tmp/triage-output.md
          echo "Done."
