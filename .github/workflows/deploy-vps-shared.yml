name: Deploy to VPS (shared)

# Reusable deploy workflow for Areté consumer repos that deploy to a
# Tailscale-reachable VPS via Docker Compose. Each consumer's deploy workflow
# becomes a thin shim that calls this with:
#   uses: aretecp/github-actions/.github/workflows/deploy-vps-shared.yml@v2
#
# Behavior:
#   1. Load the app Infisical folder in dotenv mode → render a bare KEY=value
#      .env file; append deploy-computed VERSION.
#   2. Load the infra/deploy folder (default: /tailscale) in env mode — yields
#      TAILSCALE_AUTHKEY, VPS_TAILSCALE_IP, VPS_SSH_KEY. Never written to the
#      app .env.
#   3. Connect to the Tailscale tailnet via tailscale-connect@v1.
#   4. Write the rendered env file to the VPS over ssh (base64 via ssh-action).
#   5. allow-clone gate: dev may clone; prod refuses clone (requires existing
#      checkout on the VPS).
#   6. docker compose --env-file <env-file-name> up -d --pull always
#   7. scripts/wait-for-healthy.sh over healthcheck-containers.
#
# All scaffolding is delegated to actions/vps-deploy-core — a composite that
# rollback-vps-shared and copy-prod-db-shared also consume. The proven core
# VPS logic lives in exactly one place.
#
# Scope: deploy-from-scratch only (v2). Rollback and copy-prod-db are a
# fast-follow, not covered here.
#
# REQUIRED CALLER PERMISSIONS
# ---------------------------
# The job below requests these permissions. GHA reusable workflows can
# only USE permissions the caller has GRANTED — without this block the
# call fails at startup with "is requesting '...', but is only allowed
# '...'". Copy verbatim into the calling shim (at workflow or job level):
#
#   permissions:
#     id-token: write
#     contents: read
#
# `contents: read` now does double duty: the job token it produces is what the
# VPS uses to fetch a PRIVATE repo over https, so a host needs no git credential
# placed on it by hand. See `github-token` in actions/vps-deploy-core. A box on a
# git@ remote keeps using its own SSH key and is unaffected.

on:
  workflow_call:
    inputs:
      environment:
        description: >-
          GitHub environment name (e.g. `dev`, `prod`). Controls GH environment
          protection rules and approval gates.
        required: true
        type: string

      infisical-identity-id:
        description: >-
          Infisical OIDC machine identity UUID. Safe to store as a non-secret
          org variable (e.g. `vars.INFISICAL_OIDC_IDENTITY_ID`).
        required: true
        type: string

      shared-project-slug:
        description: >-
          Infisical project slug holding shared dependencies and the infra/deploy
          folder (e.g. `lumist-labs-shared`).
        required: true
        type: string

      app-project-slug:
        description: >-
          Infisical project slug holding the app-specific secrets folder
          (e.g. `lumist-labs-internal`).
        required: true
        type: string

      env-slug:
        description: >-
          Infisical environment slug (`dev`, `prod`, etc.). Applied to both
          Infisical loads.
        required: true
        type: string

      app-path:
        description: >-
          Primary Infisical folder path (in app-project-slug) for this app's
          secrets, rendered into the dotenv file. `include-imports: true` also
          folds in any Infisical imports configured on the folder.
        required: true
        type: string

      extra-shared-path-1:
        description: >-
          Optional ADDITIONAL folder (in shared-project-slug) to render into the
          app `.env` — e.g. `/teams` or `/aws/accounts/arete/ses-sender-user`.
          For shared app secrets that several services consume. On a key
          conflict the primary `app-path` folder WINS (it is merged last).
          Empty (default) = not loaded.
        required: false
        type: string
        default: ''

      extra-shared-path-2:
        description: 'Second optional shared folder rendered into the app `.env` (see extra-shared-path-1).'
        required: false
        type: string
        default: ''

      extra-shared-path-3:
        description: 'Third optional shared folder rendered into the app `.env` (see extra-shared-path-1).'
        required: false
        type: string
        default: ''

      infra-path:
        description: >-
          Infisical folder path for deploy/infra credentials in the shared
          project. Loaded in env mode — credentials are available to the job
          but are NEVER written to the app dotenv file. Defaults to `/tailscale`
          (the existing shared infra folder that holds TAILSCALE_AUTHKEY,
          VPS_TAILSCALE_IP, VPS_SSH_KEY).
        required: false
        type: string
        default: /tailscale

      vps-user:
        description: SSH user on the VPS (e.g. `ubuntu`, `deploy`).
        required: true
        type: string

      repo-dir:
        description: >-
          Absolute path to the app checkout directory on the VPS
          (e.g. `/srv/areteos`).
        required: true
        type: string

      repo-url:
        description: >-
          Git clone URL for the app repository. Used only when `allow-clone:
          true` (dev). Ignored in prod.
        required: false
        type: string
        default: ''

      compose-file:
        description: >-
          Docker Compose file to use on the VPS (e.g. `docker-compose.prod.yml`,
          `docker-compose.dev.yml`). Relative to `repo-dir`.
        required: true
        type: string

      compose-build:
        description: >-
          `true` (default) — build images from source on the VPS
          (`up -d --build`); use this for apps whose compose file has `build:`
          stanzas (all current Areté services). `false` — `pull` pre-built
          images then `up -d` without building.
        required: false
        type: boolean
        default: true

      compose-up-timeout:
        description: >-
          SSH command timeout for the compose-up step, as a Go duration
          (e.g. `45m`). When `compose-build` is `true` this step builds the
          image on the VPS, so it has to outlast a COLD build — a dependency
          bump invalidates the cached dependency layer and the whole tree
          recompiles. Raise this for an app whose cold build is slow; the
          default suits the current Areté services.
        required: false
        type: string
        default: 30m

      env-file-name:
        description: >-
          Filename for the rendered env file on the VPS, relative to `repo-dir`.
          Convention: `.env` for prod, `.env.dev` for dev.
        required: false
        type: string
        default: .env

      ref:
        description: >-
          Git branch or tag to deploy (e.g. `main`, `v1.2.3`). Checked out
          on the VPS when `allow-clone: true`.
        required: false
        type: string
        default: main

      allow-clone:
        description: >-
          `true` — the workflow may clone the repo on the VPS if the directory
          does not exist. Set `true` for dev. `false` (default, prod) — refuses
          to clone; the checkout must already exist. This ensures prod deploys
          never silently create a fresh checkout when the dir is accidentally
          missing.
        required: false
        type: boolean
        default: false

      healthcheck-containers:
        description: >-
          Space-separated list of Docker container names to pass to
          `scripts/wait-for-healthy.sh`. All listed containers must reach
          `healthy` status before the job succeeds.
        required: true
        type: string

      required-keys:
        description: >-
          Space-separated env var names the app REQUIRES (e.g. the app's
          REQUIRED_KEYS). Before anything touches the VPS, the workflow asserts
          each is present AND non-empty in the rendered `.env` and FAILS the
          deploy if not — catching a dropped/missing secret before it can
          crash-loop the app. Empty (default) = no gate (not recommended).
        required: false
        type: string
        default: ''

      compose-force-recreate:
        description: >-
          `true` — pass `--force-recreate` to `compose up`. Avoids a race where
          a fixed `container_name` can't be reclaimed fast enough during rolling
          replacement, leaving a hash-prefixed container name that breaks
          health-inspect and Traefik routing. Default `false`.
        required: false
        type: boolean
        default: false

      # NOTE: there is deliberately no `--remove-orphans` option. On Areté VPSes
      # every box runs Traefik as a separate compose stack, and dev + prod share
      # a compose project — so --remove-orphans could only ever delete OTHER
      # running services (e.g. take down prod or the reverse proxy). Orphan
      # cleanup, when genuinely needed, is a deliberate human operation, not part
      # of an automated deploy.

      # --- Pre-deploy DB backup (first-class) -------------------------------
      # Runs after checkout, before `compose up`. Snapshots the live DB so a
      # bad migration / recreate can be recovered. Skipped cleanly on the first
      # deploy (container not yet running) and via `skip-pre-deploy`.
      db-type:
        description: >-
          `none` (default) — no pre-deploy backup. `sqlite` — integrity-check +
          WAL-safe `.backup()` of a SQLite file inside `db-container`.
          `postgres` — `pg_dump` of `db-name` from `db-container`.
        required: false
        type: string
        default: none

      db-container:
        description: >-
          Container that holds (sqlite) or serves (postgres) the DB. For sqlite
          this is whatever container mounts the data volume (often the app
          container); for postgres it's the database container. Required when
          `db-type` is not `none`.
        required: false
        type: string
        default: ''

      db-path:
        description: >-
          SQLite only: absolute path to the `.db` file inside `db-container`
          (e.g. `/app/data/bd_tracker.db`).
        required: false
        type: string
        default: ''

      db-name:
        description: 'Postgres only: database name to dump.'
        required: false
        type: string
        default: ''

      db-user:
        description: 'Postgres only: database user for `pg_dump`.'
        required: false
        type: string
        default: ''

      snapshot-dir:
        description: >-
          Directory for pre-deploy snapshots. sqlite: a path INSIDE the
          container on the data volume (default `<dirname of db-path>/pre-deploy-snapshots`).
          postgres: a path on the VPS HOST under repo-dir
          (default `<repo-dir>/pre-deploy-snapshots`). Either way it must be on
          persistent storage, not ephemeral.
        required: false
        type: string
        default: ''

      snapshot-retention-days:
        description: 'Prune pre-deploy snapshots older than this many days. Default 7.'
        required: false
        type: number
        default: 7

      skip-pre-deploy:
        description: >-
          Break-glass: `true` skips the pre-deploy DB backup entirely. Wire this
          to a `workflow_dispatch` input so operators can recover from a broken
          API without the backup step blocking the deploy. Default `false`.
        required: false
        type: boolean
        default: false

      deploy-concurrency-group:
        description: >-
          Override the serialisation key for VPS operations. Defaults to
          `vps-<vps-user>-<repo-dir>`, which serialises EVERY operation
          targeting that directory — dev and prod, deploy and rollback and
          copy-db — because they all `git checkout --force` in it. Set this only
          with a specific reason; a value that differs per workflow re-opens the
          race this exists to close. Must match across `deploy-vps-shared`,
          `rollback-vps-shared` and `copy-prod-db-shared` for the same target.
        required: false
        type: string
        default: ''

      runner:
        description: >-
          Runner for this job: a GitHub-hosted image name or a self-hosted
          runner label (e.g. `omarchy`). Self-hosted runners that are already
          tailnet nodes are handled by tailscale-connect's join guard.
        required: false
        type: string
        default: ubuntu-latest
jobs:
  deploy:
    name: Deploy to VPS (${{ inputs.environment }})
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}

    # Serialise on the DEPLOY TARGET, not on the calling workflow.
    #
    # `vps-deploy-core` does `git checkout --force` in `repo-dir` and then
    # `compose up` from that tree. Two runs against the same directory race, and
    # the loser can build prod containers from the other one's source. The
    # invariant is a property of the directory, so it belongs here — a caller
    # that hand-writes its own group has to rediscover it, and they get it
    # wrong: bd-pulse only serialises dev against prod because it was bitten
    # (aretecp/bd-pulse#2299), and areteos still uses separate `deploy-dev` /
    # `deploy-prod` groups against one shared `repo-dir`.
    #
    # Grouping here covers dev vs prod, deploy vs rollback vs copy-db, and any
    # future caller, with no consumer change. Callers keep their own
    # workflow-level `concurrency` for their own reasons; both apply.
    #
    # The VPS host is deliberately NOT in the key: it is resolved from Infisical
    # at runtime, long after concurrency is evaluated. So two genuinely
    # different hosts sharing a `repo-dir` path over-serialise. That is the safe
    # direction to be wrong in, and it does not apply today — every Areté app
    # runs dev and prod on one host out of one directory (see the
    # `--remove-orphans` note in vps-deploy-core).
    #
    # `github.repository` (the CALLER's repo) leads the key as a blast-radius
    # guard. Whether `inputs` resolves inside a called workflow's job-level
    # `concurrency` is not something this repo has verified; if it ever came back
    # empty, a key of `vps--` would serialise every deploy across all NINE repos
    # that call this workflow — areteos, areteos-py, ari-command-center,
    # ari-vendor-matching, bd-pulse, beacon, litellm-gateway, performance-review,
    # watterson-vendor-matching. With the repo in front, that degrades to
    # per-repo serialisation, which is still strictly better than today. It costs
    # nothing when the inputs do resolve: different repos already use different
    # `repo-dir` paths.
    concurrency:
      group: >-
        ${{ inputs.deploy-concurrency-group != ''
            && inputs.deploy-concurrency-group
            || format('vps-{0}-{1}-{2}', github.repository, inputs.vps-user, inputs.repo-dir) }}
      # Never cancel a deploy mid-recreate — queue behind it instead.
      cancel-in-progress: false

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Deploy via vps-deploy-core
        # Pinned to the moving major tag, like every other consumer.
        #
        # This line briefly pointed at a feature branch so the git-auth change
        # could be validated (#100). That is the only way to exercise a changed
        # core action — `uses:` takes no expressions, and a relative
        # `./actions/...` inside a REUSABLE workflow resolves against the CALLER's
        # checkout, which has no such path. The branch pin then merged by mistake
        # and GitHub deleted the branch, leaving main pointing at a dead ref.
        #
        # So: any future validation must revert this line before merge, and that
        # hazard is tracked rather than left to a comment nobody reads.
        uses: aretecp/github-actions/actions/vps-deploy-core@v2
        with:
          infisical-identity-id: ${{ inputs.infisical-identity-id }}
          shared-project-slug: ${{ inputs.shared-project-slug }}
          app-project-slug: ${{ inputs.app-project-slug }}
          env-slug: ${{ inputs.env-slug }}
          app-path: ${{ inputs.app-path }}
          extra-shared-path-1: ${{ inputs.extra-shared-path-1 }}
          extra-shared-path-2: ${{ inputs.extra-shared-path-2 }}
          extra-shared-path-3: ${{ inputs.extra-shared-path-3 }}
          infra-path: ${{ inputs.infra-path }}
          vps-user: ${{ inputs.vps-user }}
          repo-dir: ${{ inputs.repo-dir }}
          repo-url: ${{ inputs.repo-url }}
          compose-file: ${{ inputs.compose-file }}
          compose-build: ${{ inputs.compose-build }}
          compose-up-timeout: ${{ inputs.compose-up-timeout }}
          env-file-name: ${{ inputs.env-file-name }}
          ref: ${{ inputs.ref }}
          allow-clone: ${{ inputs.allow-clone }}
          healthcheck-containers: ${{ inputs.healthcheck-containers }}
          required-keys: ${{ inputs.required-keys }}
          compose-force-recreate: ${{ inputs.compose-force-recreate }}
          db-type: ${{ inputs.db-type }}
          db-container: ${{ inputs.db-container }}
          db-path: ${{ inputs.db-path }}
          db-name: ${{ inputs.db-name }}
          db-user: ${{ inputs.db-user }}
          snapshot-dir: ${{ inputs.snapshot-dir }}
          snapshot-retention-days: ${{ inputs.snapshot-retention-days }}
          skip-pre-deploy: ${{ inputs.skip-pre-deploy }}
