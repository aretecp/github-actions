name: Smoke — teams-notify

# Exercises payload construction for actions/teams-notify on any PR that touches
# it. Runs entirely in `dry-run` so it never posts to a real channel — a smoke
# test that spammed the PR-notify channel on every push would get the whole
# notification system muted, which is the opposite of what this action is for.
#
# First smoke workflow in the repo. CONTRIBUTING.md step 5 says to copy the
# pattern from an existing one; there wasn't one, so this is the pattern.

on:
  pull_request:
    paths:
      - 'actions/teams-notify/**'
      - '.github/workflows/smoke-teams-notify.yml'

permissions:
  contents: read

jobs:
  payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Minimal card
        id: minimal
        uses: ./actions/teams-notify
        with:
          title: Smoke test
          text: Minimal payload, no facts and no button.
          dry-run: 'true'

      - name: Full card
        id: full
        uses: ./actions/teams-notify
        with:
          title: 'Rotating a secret: "quoted" & <special> chars'
          text: |
            Multi-line body with **markdown**.

            Second paragraph.
          status: warning
          facts: '[{"name":"App","value":"arilearn"},{"name":"Expires","value":"2026-08-11"}]'
          button-url: https://example.com/run/1
          button-label: Watch run
          dry-run: 'true'

      - name: Assert payload shape
        env:
          MINIMAL: ${{ steps.minimal.outputs.payload }}
          FULL: ${{ steps.full.outputs.payload }}
        run: |
          set -euo pipefail

          # Both must be valid JSON — the whole point of building with jq is that
          # quotes and specials in the title can't break it.
          printf '%s' "$MINIMAL" | jq -e . >/dev/null
          printf '%s' "$FULL"    | jq -e . >/dev/null

          printf '%s' "$MINIMAL" | jq -e '.themeColor == "0076D7"' >/dev/null
          printf '%s' "$MINIMAL" | jq -e '.sections[0] | has("facts") | not' >/dev/null
          printf '%s' "$MINIMAL" | jq -e 'has("potentialAction") | not' >/dev/null

          printf '%s' "$FULL" | jq -e '.themeColor == "D29922"' >/dev/null
          printf '%s' "$FULL" | jq -e '.sections[0].facts | length == 2' >/dev/null
          printf '%s' "$FULL" | jq -e '.potentialAction[0].targets[0].uri == "https://example.com/run/1"' >/dev/null
          printf '%s' "$FULL" | jq -e '.sections[0].text | contains("[Watch run →](https://example.com/run/1)")' >/dev/null
          printf '%s' "$FULL" | jq -e '.title | contains("\"quoted\"")' >/dev/null

          echo "Payload shape OK for both cards."

  rejects-bad-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # continue-on-error + explicit outcome check: the action MUST fail here.
      # A validator that silently accepts garbage is worse than no validator.
      - name: Invalid status should fail
        id: bad_status
        continue-on-error: true
        uses: ./actions/teams-notify
        with:
          title: t
          text: x
          status: not-a-status
          dry-run: 'true'

      - name: Invalid facts should fail
        id: bad_facts
        continue-on-error: true
        uses: ./actions/teams-notify
        with:
          title: t
          text: x
          facts: '{"not":"an array"}'
          dry-run: 'true'

      - name: Assert both were rejected
        run: |
          set -euo pipefail
          [ "${{ steps.bad_status.outcome }}" = "failure" ] || { echo "invalid status was accepted"; exit 1; }
          [ "${{ steps.bad_facts.outcome }}"  = "failure" ] || { echo "invalid facts were accepted"; exit 1; }
          echo "Both invalid inputs correctly rejected."
