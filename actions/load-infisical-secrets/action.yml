name: Load Infisical Secrets
description: >-
  Fetches secrets from Areté's Infisical instance via Universal Auth and exports
  them to subsequent workflow steps as env vars (default) or as a JSON output.

# When bumping the upstream Infisical/secrets-action SHA, also bump this action's
# major version per the policy in CONTRIBUTING.md if any caller-visible behavior
# changes (input/output shape, defaults). Internal upstream patches are minor or
# patch bumps.

inputs:
  project-slug:
    description: >-
      Infisical project slug (e.g. `arete-platform`). NOT the project UUID.
      Find it in the Infisical UI under Project Settings.
    required: true

  environment:
    description: >-
      Infisical environment slug (e.g. `prod`, `staging`, `dev`). Maps to
      upstream `env-slug`.
    required: true

  path:
    description: Folder path within the project. Defaults to root.
    required: false
    default: /

  method:
    description: >-
      Authentication method. `universal` (default) uses
      client-id/client-secret. `oidc` uses a short-lived GitHub OIDC token
      exchanged for an Infisical access token at workflow runtime — no
      stored Infisical credentials. Caller must declare
      `permissions: id-token: write` on the job when using `oidc`.
      `aws-iam` passes through to upstream for completeness.
    required: false
    default: universal

  client-id:
    description: >-
      Universal Auth client ID. Required when method=universal. Pass the
      INFISICAL_CLIENT_ID secret from the caller's context.
    required: false

  client-secret:
    description: >-
      Universal Auth client secret. Required when method=universal. Pass the
      INFISICAL_CLIENT_SECRET secret from the caller's context.
    required: false

  identity-id:
    description: >-
      Infisical OIDC machine identity UUID. Required when method=oidc. Get
      it from the Infisical UI under Identities. Safe to store as a repo or
      org variable (not a secret).
    required: false

  oidc-audience:
    description: >-
      Custom audience claim for the GitHub OIDC token. Optional even when
      method=oidc; defaults to upstream's default audience. Set if your
      Infisical OIDC identity expects a specific audience string.
    required: false

  export-as-env:
    description: >-
      `'true'` (default) exports each resolved secret as an env var available to
      subsequent steps. `'false'` skips env export and emits the resolved
      secrets as a JSON map on the `secrets` output. `'dotenv'` writes a bare
      `KEY=value` dotenv file to `dotenv-output-path` (no quote-wrapping —
      `docker compose --env-file` treats quotes literally). Masking is applied
      in all modes.
    required: false
    default: 'true'

  dotenv-output-path:
    description: >-
      File path where the rendered dotenv file is written when
      `export-as-env: 'dotenv'`. Defaults to `$RUNNER_TEMP/infisical.env`.
      Ignored in all other modes.
    required: false
    default: ''

  recursive:
    description: >-
      `'true'` fetches secrets at the given path AND all subpaths. Defaults to
      `'false'` (path only).
    required: false
    default: 'false'

  include-imports:
    description: >-
      `'true'` follows Infisical env-import links (e.g. `prod` env importing
      from a `shared` project). Defaults to `'true'`.
    required: false
    default: 'true'

  domain:
    description: >-
      Infisical instance URL. Defaults to Areté's self-hosted instance. Override
      to target Infisical Cloud (`https://app.infisical.com`) or another
      instance.
    required: false
    default: https://secrets.areteintelligence.ai

outputs:
  secrets:
    description: >-
      JSON map of resolved secrets ({"NAME": "value", ...}). Set only when
      `export-as-env: 'false'`. Each value is masked via `::add-mask::` before
      the output is set.
    value: ${{ steps.json.outputs.secrets }}

  dotenv-file-path:
    description: >-
      Absolute path to the rendered dotenv file. Set only when
      `export-as-env: 'dotenv'`. Callers can pass this path to
      `appleboy/scp-action` or `docker compose --env-file`.
    value: ${{ steps.dotenv.outputs.dotenv-file-path }}

runs:
  using: composite
  steps:
    - name: Fetch secrets (env mode)
      if: ${{ inputs.export-as-env == 'true' }}
      uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995  # v1.0.16
      with:
        method: ${{ inputs.method }}
        client-id: ${{ inputs.client-id }}
        client-secret: ${{ inputs.client-secret }}
        identity-id: ${{ inputs.identity-id }}
        oidc-audience: ${{ inputs.oidc-audience }}
        project-slug: ${{ inputs.project-slug }}
        env-slug: ${{ inputs.environment }}
        secret-path: ${{ inputs.path }}
        domain: ${{ inputs.domain }}
        recursive: ${{ inputs.recursive }}
        include-imports: ${{ inputs.include-imports }}
        export-type: env

    - name: Fetch secrets (file mode — JSON output path)
      if: ${{ inputs.export-as-env == 'false' }}
      uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995  # v1.0.16
      with:
        method: ${{ inputs.method }}
        client-id: ${{ inputs.client-id }}
        client-secret: ${{ inputs.client-secret }}
        identity-id: ${{ inputs.identity-id }}
        oidc-audience: ${{ inputs.oidc-audience }}
        project-slug: ${{ inputs.project-slug }}
        env-slug: ${{ inputs.environment }}
        secret-path: ${{ inputs.path }}
        domain: ${{ inputs.domain }}
        recursive: ${{ inputs.recursive }}
        include-imports: ${{ inputs.include-imports }}
        export-type: file
        # Leading slash required — see the dotenv step's note on upstream's
        # string-concat path handling.
        file-output-path: /load-infisical-secrets.env

    - name: Convert .env to JSON output
      id: json
      if: ${{ inputs.export-as-env == 'false' }}
      shell: bash
      env:
        SECRETS_FILE: ${{ github.workspace }}/load-infisical-secrets.env
      run: |
        set -euo pipefail

        if [[ ! -f "$SECRETS_FILE" ]]; then
          echo "::error::Expected secrets file not found at $SECRETS_FILE"
          # Self-diagnose: upstream's path handling has bitten before. Show
          # where it might have actually written so a failure is immediately
          # debuggable without an instrumented re-run.
          echo "--- workspace ($GITHUB_WORKSPACE):" >&2; ls -la "$GITHUB_WORKSPACE" 2>/dev/null || true
          echo "--- parent:" >&2; ls -la "$(dirname "$GITHUB_WORKSPACE")" 2>/dev/null || true
          exit 1
        fi

        # Parse KEY=VALUE lines into a JSON object. Handles values that are
        # double-quoted by upstream (.env style). Single-line values only;
        # multi-line secrets (PEM keys, etc.) are not supported with
        # export-as-env=false in this version.
        json=$(jq -Rs '
          [ split("\n")[]
            | select(test("^[A-Za-z_][A-Za-z0-9_]*="))
            | capture("^(?<k>[A-Za-z_][A-Za-z0-9_]*)=(?<v>.*)$")
            | { key: .k,
                value: ( if (.v | startswith("\"") and endswith("\"")) and (.v | length) >= 2
                         then (.v | fromjson)
                         else .v
                         end ) }
          ] | from_entries
        ' < "$SECRETS_FILE")

        # Defensively mask each value (idempotent if upstream already did).
        # Reading values via jq -r so we don't echo them through bash interpolation.
        while IFS= read -r v; do
          [[ -n "$v" ]] && echo "::add-mask::$v"
        done < <(printf '%s' "$json" | jq -r '.[] | tostring')

        # Mask the JSON blob too — it contains every value concatenated.
        echo "::add-mask::$json"

        # Emit as a multi-line step output via heredoc-style delimiter.
        delim="EOF_$(openssl rand -hex 12)"
        {
          echo "secrets<<$delim"
          printf '%s\n' "$json"
          echo "$delim"
        } >> "$GITHUB_OUTPUT"

        # Best-effort cleanup. The runner is ephemeral but be tidy.
        rm -f "$SECRETS_FILE"

    - name: Fetch secrets (file mode — dotenv output path)
      if: ${{ inputs.export-as-env == 'dotenv' }}
      uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995  # v1.0.16
      with:
        method: ${{ inputs.method }}
        client-id: ${{ inputs.client-id }}
        client-secret: ${{ inputs.client-secret }}
        identity-id: ${{ inputs.identity-id }}
        oidc-audience: ${{ inputs.oidc-audience }}
        project-slug: ${{ inputs.project-slug }}
        env-slug: ${{ inputs.environment }}
        secret-path: ${{ inputs.path }}
        domain: ${{ inputs.domain }}
        recursive: ${{ inputs.recursive }}
        include-imports: ${{ inputs.include-imports }}
        export-type: file
        # Upstream builds the output path by STRING-CONCAT: GITHUB_WORKSPACE +
        # file-output-path (no path.join). So the value must start with `/` to
        # land at <workspace>/<file>; a bare name glues on with no separator
        # (`<ws>bd-pulseload-...`) and an absolute path doubles. The render step
        # reads it back as ${{ github.workspace }}/<same file>.
        file-output-path: /load-infisical-secrets-dotenv.env

    - name: Render bare dotenv file
      id: dotenv
      if: ${{ inputs.export-as-env == 'dotenv' }}
      shell: bash
      env:
        SECRETS_FILE: ${{ github.workspace }}/load-infisical-secrets-dotenv.env
        DOTENV_OUTPUT_PATH: ${{ inputs.dotenv-output-path }}
      run: |
        set -euo pipefail

        if [[ ! -f "$SECRETS_FILE" ]]; then
          echo "::error::Expected secrets file not found at $SECRETS_FILE"
          # Self-diagnose: upstream's path handling has bitten before. Show
          # where it might have actually written so a failure is immediately
          # debuggable without an instrumented re-run.
          echo "--- workspace ($GITHUB_WORKSPACE):" >&2; ls -la "$GITHUB_WORKSPACE" 2>/dev/null || true
          echo "--- parent:" >&2; ls -la "$(dirname "$GITHUB_WORKSPACE")" 2>/dev/null || true
          exit 1
        fi

        # Resolve output path: caller-supplied or default under runner.temp.
        if [[ -z "$DOTENV_OUTPUT_PATH" ]]; then
          OUT_FILE="$RUNNER_TEMP/infisical.env"
        else
          OUT_FILE="$DOTENV_OUTPUT_PATH"
        fi

        # Render bare KEY=value lines — no quote-wrapping.
        # docker compose --env-file treats quotes literally, so we strip any
        # double-quote wrapping that upstream's .env serialiser may have added.
        # Single-line values only; multi-line secrets (PEM keys, etc.) are not
        # supported in dotenv mode.
        #
        # Parse rules (matching the upstream file format):
        #   - Skip blank lines and comment lines (# ...)
        #   - Accept KEY=value and KEY="value" (upstream may quote)
        #   - Strip surrounding double-quotes from value if present
        #   - Emit as bare KEY=value
        # IMPORTANT: only `KEY=value` lines may reach $OUT_FILE. The
        # `::add-mask::` directives must go to the step's stdout (so the runner
        # masks them) — NOT into the file. So append KEY=value per line and let
        # the mask echo flow to stdout; do NOT redirect the whole loop to the
        # file (that would write the ::add-mask:: lines into the .env and break
        # `docker compose --env-file`).
        : > "$OUT_FILE"
        while IFS= read -r line; do
          # Skip blank lines and comments
          [[ -z "$line" || "$line" == \#* ]] && continue

          # Must look like KEY=...
          if [[ "$line" =~ ^([A-Za-z_][A-Za-z0-9_]*)=(.*)$ ]]; then
            k="${BASH_REMATCH[1]}"
            v="${BASH_REMATCH[2]}"

            # Strip surrounding double-quotes if present (upstream .env style)
            if [[ ${#v} -ge 2 && "$v" == '"'*'"' ]]; then
              v="${v:1:${#v}-2}"
            fi

            # Mask the value (to stdout/log, idempotent if upstream already did).
            [[ -n "$v" ]] && echo "::add-mask::$v"

            # Only the assignment goes to the file.
            printf '%s=%s\n' "$k" "$v" >> "$OUT_FILE"
          fi
        done < "$SECRETS_FILE"

        # Validate: file must be non-empty (at least one secret rendered).
        if [[ ! -s "$OUT_FILE" ]]; then
          echo "::error::Dotenv render produced an empty file — check that the Infisical path contains secrets and include-imports is set correctly."
          exit 1
        fi

        echo "dotenv-file-path=$OUT_FILE" >> "$GITHUB_OUTPUT"

        # Best-effort cleanup of the intermediate file.
        rm -f "$SECRETS_FILE"
