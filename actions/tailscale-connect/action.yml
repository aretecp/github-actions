name: Tailscale Connect (Areté)
description: >-
  Join the Areté Tailscale tailnet. Wraps tailscale/github-action with a
  pinned SHA and Areté defaults so version bumps and any auth-method
  migration go through code review here, once, instead of being scattered
  across 14+ workflows.

# When bumping the upstream tailscale/github-action SHA, also bump this
# action's major version per the policy in CONTRIBUTING.md if any
# caller-visible behavior changes (input names/defaults). The current pin
# corresponds to the v3 moving tag at the time of authoring.

inputs:
  authkey:
    description: >-
      Tailscale auth key. Pass `secrets.TAILSCALE_AUTHKEY` from the
      consumer repo's secret store.
    required: true
  version:
    description: >-
      Tailscale CLI version to install. Defaults to a version known
      compatible with the pinned upstream action SHA.
    required: false
    default: '1.80.0'

runs:
  using: composite
  steps:
    # Self-hosted runners may BE tailnet nodes already (e.g. the omarchy
    # runner). Running `tailscale up --authkey` there would re-authenticate the
    # host as a fresh ephemeral node and hijack its identity, knocking it off
    # the tailnet under its real name. So: detect an existing connection and
    # skip the join entirely.
    #
    # Fail-safe direction matters. If the CLI exists but its state is
    # unreadable (tailscaled socket permissions — non-root needs
    # `tailscale set --operator=$USER`), we CANNOT tell "not connected" from
    # "can't ask", and joining on a maybe-connected host is the dangerous
    # branch. Hard-fail with instructions instead. Hosted runners have no
    # tailscale CLI at all, so they always take the join path unchanged.
    - name: Detect existing tailnet connection
      id: detect
      shell: bash
      run: |
        set -uo pipefail
        if ! command -v tailscale >/dev/null 2>&1; then
          echo "connected=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if TS_IP=$(tailscale ip -4 2>/dev/null | head -1) && [ -n "$TS_IP" ]; then
          echo "Runner host is already on the tailnet — skipping join."
          echo "connected=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "::error::tailscale CLI is present on this runner but its state is unreadable or disconnected. Refusing to run 'tailscale up --authkey' on a host that may already be a tailnet node (it would hijack the node identity). If this is a self-hosted runner that should be on the tailnet, connect it and grant the runner user operator access: 'sudo tailscale set --operator=<runner-user>'. If it should NOT be on the tailnet, remove the tailscale CLI from the host."
        exit 1

    - name: Join Tailscale
      if: steps.detect.outputs.connected == 'false'
      # v3 (resolved at time of authoring). Pinned by SHA to make upstream
      # bumps explicit. Use OAuth client/secret instead of authkey when
      # we migrate (see CONTRIBUTING.md auth migration note).
      uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade
      with:
        authkey: ${{ inputs.authkey }}
        version: ${{ inputs.version }}

    # The upstream action retries `tailscale up` and then exits 0 EVEN IF every
    # attempt failed. A dead auth key therefore produces a green "Connect to
    # Tailscale" step, and the run fails much later at the ssh step with
    # `dial tcp ***:22: i/o timeout` — which reads like a firewall or a wrong
    # host, not an auth problem.
    #
    # Observed 2026-07-28 in contact-intelligence run 30380967420: five
    # consecutive `backend error: invalid key: API key does not exist`, step
    # reported success, ~3 minutes later an opaque SSH timeout. Cost about an
    # hour to trace. Assert connectivity here so the failure names its cause.
    - name: Verify tailnet connectivity
      shell: bash
      run: |
        set -uo pipefail

        if ! command -v tailscale >/dev/null 2>&1; then
          echo "::error::tailscale CLI not on PATH — the join step did not install it."
          exit 1
        fi

        # `tailscale ip -4` only returns an address once the node is actually
        # authenticated and up, so it doubles as the connectivity assertion.
        # Deliberately not echoed: it identifies a host on the tailnet.
        if ! TS_IP=$(tailscale ip -4 2>/dev/null | head -1) || [ -z "$TS_IP" ]; then
          echo "::error::Not connected to the Tailscale tailnet. The join step above exits 0 even when every retry failed — scroll up for the real reason. Most common: TAILSCALE_AUTHKEY is expired or revoked ('invalid key: API key does not exist'). Auth keys expire (90 days max), so a workflow that last ran months ago will hit this. Mint a new key and update it wherever this workflow reads it from."
          exit 1
        fi

        echo "Connected to tailnet as $(tailscale status --json 2>/dev/null | jq -r '.Self.HostName // "unknown"')."
