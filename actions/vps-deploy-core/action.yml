name: VPS Deploy Core
description: >-
  Composite action: load app secrets → render env file → load infra creds →
  connect to Tailscale → checkout/clone on VPS → write env file → optional
  pre-deploy DB backup → optional pre-compose-up-script hook → docker compose
  up → wait-for-healthy. Used by deploy-vps-shared and rollback-vps-shared.

# ADDITIVE HOOK
# -------------
# `pre-compose-up-script`: a shell script (multi-line string) to run on the VPS
# via ssh AFTER the env file is written and AFTER the pre-deploy DB backup step,
# BEFORE `docker compose up`. Skipped when empty (default). Intended for rollback
# DB restore; the script runs as the vps-user inside the VPS shell.
#
# Deploy callers pass nothing → hook is skipped → no behavior change.
# Rollback callers pass the DB restore script → hook runs the restore.

inputs:
  # --- Infisical identity -------------------------------------------------------
  infisical-identity-id:
    description: Infisical OIDC machine identity UUID.
    required: true

  shared-project-slug:
    description: Infisical project slug holding the infra/deploy folder.
    required: true

  app-project-slug:
    description: Infisical project slug holding the app-specific secrets folder.
    required: true

  env-slug:
    description: Infisical environment slug (dev, prod, etc.).
    required: true

  app-path:
    description: Primary Infisical folder path (in app-project-slug) for this app's secrets.
    required: true

  extra-shared-path-1:
    description: Optional additional folder (in shared-project-slug) rendered into the app .env.
    required: false
    default: ''

  extra-shared-path-2:
    description: Second optional shared folder rendered into the app .env.
    required: false
    default: ''

  extra-shared-path-3:
    description: Third optional shared folder rendered into the app .env.
    required: false
    default: ''

  infra-path:
    description: >-
      Infisical folder path for deploy/infra credentials in the shared project.
      Loaded in env mode (never written to the app dotenv). Defaults to /tailscale.
    required: false
    default: /tailscale

  # --- Env file -----------------------------------------------------------------
  env-file-name:
    description: >-
      Filename for the rendered env file on the VPS, relative to repo-dir.
      Convention: .env for prod, .env.dev for dev.
    required: false
    default: .env

  version-label:
    description: >-
      Value to append as VERSION= in the rendered env file. For deploy this is
      the git ref (e.g. main, v1.2.3); for rollback this is the rollback tag.
    required: true

  # --- VPS connection -----------------------------------------------------------
  vps-user:
    description: SSH user on the VPS (e.g. ubuntu, deploy).
    required: true

  repo-dir:
    description: Absolute path to the app checkout directory on the VPS.
    required: true

  repo-url:
    description: >-
      Git clone URL. Used only when allow-clone=true (dev). Ignored otherwise.
    required: false
    default: ''

  ref:
    description: >-
      Git branch or tag to check out on the VPS. Used when allow-clone=true
      (deploy) or always for tag checkout (rollback should pass the version tag
      here and set allow-clone=false).
    required: false
    default: main

  allow-clone:
    description: >-
      true — may clone repo-url on the VPS if the checkout directory does not
      exist (dev only). false (default) — requires existing checkout; fails
      with a clear error if the dir is missing.
    required: false
    default: 'false'

  # --- Compose ------------------------------------------------------------------
  compose-file:
    description: Docker Compose file to use on the VPS. Relative to repo-dir.
    required: true

  compose-build:
    description: >-
      true (default) — build images from source (up -d --build).
      false — pull pre-built images then up -d.
    required: false
    default: 'true'

  compose-force-recreate:
    description: true — pass --force-recreate to compose up. Default false.
    required: false
    default: 'false'

  healthcheck-containers:
    description: >-
      Space-separated list of Docker container names to pass to
      scripts/wait-for-healthy.sh. All must reach healthy status.
    required: true

  # --- Pre-deploy DB backup (skipped when db-type=none) -------------------------
  db-type:
    description: >-
      none (default) — no pre-deploy backup. sqlite — WAL-safe .backup() of
      db-path inside db-container. postgres — pg_dump of db-name from
      db-container. Pass none to skip (rollback restores; it does not snapshot).
    required: false
    default: none

  db-container:
    description: Container that holds (sqlite) or serves (postgres) the DB.
    required: false
    default: ''

  db-path:
    description: SQLite only — absolute path to the .db file inside db-container.
    required: false
    default: ''

  db-name:
    description: Postgres only — database name to dump.
    required: false
    default: ''

  db-user:
    description: Postgres only — database user for pg_dump.
    required: false
    default: ''

  snapshot-dir:
    description: >-
      Directory for pre-deploy snapshots. sqlite: inside the container on the
      data volume. postgres: on the VPS host under repo-dir. Must be persistent.
    required: false
    default: ''

  snapshot-retention-days:
    description: Prune pre-deploy snapshots older than this many days. Default 7.
    required: false
    default: '7'

  skip-pre-deploy:
    description: >-
      Break-glass: true skips the pre-deploy DB backup entirely.
    required: false
    default: 'false'

  # --- Hook (additive, default empty = no-op) -----------------------------------
  pre-compose-up-script:
    description: >-
      Shell script to run on the VPS (via ssh) AFTER the env file is written
      and AFTER the pre-deploy DB backup, BEFORE docker compose up. Executed
      as vps-user inside the VPS shell. Skipped when empty (default).
      Callers are responsible for all logic inside the script.
      Deploy callers omit this input → no behavior change.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # ---------------------------------------------------------------------------
    # Env file render
    # ---------------------------------------------------------------------------

    - name: Load app secrets from Infisical (dotenv mode)
      id: load-app-secrets
      uses: aretecp/github-actions/actions/load-infisical-secrets@v2
      with:
        method: oidc
        identity-id: ${{ inputs.infisical-identity-id }}
        project-slug: ${{ inputs.app-project-slug }}
        environment: ${{ inputs.env-slug }}
        path: ${{ inputs.app-path }}
        include-imports: 'true'
        export-as-env: dotenv
        dotenv-output-path: ${{ runner.temp }}/${{ inputs.env-file-name }}

    - name: Load extra shared folder 1 (dotenv mode)
      id: extra-1
      if: ${{ inputs.extra-shared-path-1 != '' }}
      uses: aretecp/github-actions/actions/load-infisical-secrets@v2
      with:
        method: oidc
        identity-id: ${{ inputs.infisical-identity-id }}
        project-slug: ${{ inputs.shared-project-slug }}
        environment: ${{ inputs.env-slug }}
        path: ${{ inputs.extra-shared-path-1 }}
        recursive: 'true'
        include-imports: 'true'
        export-as-env: dotenv
        dotenv-output-path: ${{ runner.temp }}/extra-shared-1.env

    - name: Load extra shared folder 2 (dotenv mode)
      id: extra-2
      if: ${{ inputs.extra-shared-path-2 != '' }}
      uses: aretecp/github-actions/actions/load-infisical-secrets@v2
      with:
        method: oidc
        identity-id: ${{ inputs.infisical-identity-id }}
        project-slug: ${{ inputs.shared-project-slug }}
        environment: ${{ inputs.env-slug }}
        path: ${{ inputs.extra-shared-path-2 }}
        recursive: 'true'
        include-imports: 'true'
        export-as-env: dotenv
        dotenv-output-path: ${{ runner.temp }}/extra-shared-2.env

    - name: Load extra shared folder 3 (dotenv mode)
      id: extra-3
      if: ${{ inputs.extra-shared-path-3 != '' }}
      uses: aretecp/github-actions/actions/load-infisical-secrets@v2
      with:
        method: oidc
        identity-id: ${{ inputs.infisical-identity-id }}
        project-slug: ${{ inputs.shared-project-slug }}
        environment: ${{ inputs.env-slug }}
        path: ${{ inputs.extra-shared-path-3 }}
        recursive: 'true'
        include-imports: 'true'
        export-as-env: dotenv
        dotenv-output-path: ${{ runner.temp }}/extra-shared-3.env

    - name: Merge extra shared folders into the env file
      if: ${{ inputs.extra-shared-path-1 != '' || inputs.extra-shared-path-2 != '' || inputs.extra-shared-path-3 != '' }}
      shell: bash
      env:
        APP_FILE: ${{ steps.load-app-secrets.outputs.dotenv-file-path }}
        E1: ${{ steps.extra-1.outputs.dotenv-file-path }}
        E2: ${{ steps.extra-2.outputs.dotenv-file-path }}
        E3: ${{ steps.extra-3.outputs.dotenv-file-path }}
      run: |
        set -euo pipefail
        tmp="$(mktemp)"
        # Extras first, primary app folder LAST → app wins on duplicate keys.
        for f in "$E1" "$E2" "$E3"; do
          [[ -n "$f" && -f "$f" ]] && cat "$f" >> "$tmp"
        done
        cat "$APP_FILE" >> "$tmp"
        mv "$tmp" "$APP_FILE"
        echo "Merged extra shared folder(s) into $APP_FILE ($(grep -c '=' "$APP_FILE") vars total)."

    - name: Append VERSION to dotenv file
      shell: bash
      env:
        DOTENV_FILE: ${{ steps.load-app-secrets.outputs.dotenv-file-path }}
        VERSION_LABEL: ${{ inputs.version-label }}
      run: |
        set -euo pipefail
        printf 'VERSION=%s\n' "$VERSION_LABEL" >> "$DOTENV_FILE"
        echo "Appended VERSION=${VERSION_LABEL} to dotenv file"

    - name: Encode rendered env file for transfer
      id: encode-env
      shell: bash
      env:
        DOTENV_FILE: ${{ steps.load-app-secrets.outputs.dotenv-file-path }}
      run: |
        set -euo pipefail
        # Single-line base64 so the whole .env rides through ssh-action's
        # envs: as one variable — no quoting issues. Masked since it is secrets.
        b64="$(base64 -w0 "$DOTENV_FILE")"
        echo "::add-mask::$b64"
        echo "b64=$b64" >> "$GITHUB_OUTPUT"

    # ---------------------------------------------------------------------------
    # Infra creds + Tailscale
    # ---------------------------------------------------------------------------

    - name: Load infra secrets from Infisical (env mode)
      uses: aretecp/github-actions/actions/load-infisical-secrets@v2
      with:
        method: oidc
        identity-id: ${{ inputs.infisical-identity-id }}
        project-slug: ${{ inputs.shared-project-slug }}
        environment: ${{ inputs.env-slug }}
        path: ${{ inputs.infra-path }}
        recursive: 'true'
        include-imports: 'true'
        export-as-env: 'true'

    - name: Connect to Tailscale
      uses: aretecp/github-actions/actions/tailscale-connect@v1
      with:
        authkey: ${{ env.TAILSCALE_AUTHKEY }}

    # ---------------------------------------------------------------------------
    # VPS checkout + env file write
    # ---------------------------------------------------------------------------

    - name: Prepare repo checkout on VPS
      uses: appleboy/ssh-action@v1.2.0
      env:
        REPO_DIR: ${{ inputs.repo-dir }}
        REPO_URL: ${{ inputs.repo-url }}
        REF: ${{ inputs.ref }}
        ALLOW_CLONE: ${{ inputs.allow-clone }}
      with:
        host: ${{ env.VPS_TAILSCALE_IP }}
        username: ${{ inputs.vps-user }}
        key: ${{ env.VPS_SSH_KEY }}
        envs: REPO_DIR,REPO_URL,REF,ALLOW_CLONE
        script: |
          set -euo pipefail

          if [[ ! -d "$REPO_DIR/.git" ]]; then
            if [[ "$ALLOW_CLONE" != "true" ]]; then
              echo "::error::repo-dir '$REPO_DIR' does not contain a git checkout and allow-clone is false." >&2
              echo "For prod/rollback deploys the checkout must already exist on the VPS." >&2
              exit 1
            fi
            echo "Cloning $REPO_URL into $REPO_DIR..."
            git clone "$REPO_URL" "$REPO_DIR"
          fi

          cd "$REPO_DIR"
          echo "Fetching and checking out $REF..."
          git fetch --prune --tags --force origin
          git checkout --force "$REF"
          # Fast-forward only when on a branch; tags/detached HEAD are already
          # at the right commit and a pull would be meaningless or fail.
          if git symbolic-ref -q HEAD >/dev/null; then
            git pull --ff-only origin "$REF"
          fi

    - name: Write env file to VPS
      uses: appleboy/ssh-action@v1.2.0
      env:
        REPO_DIR: ${{ inputs.repo-dir }}
        ENV_FILE_NAME: ${{ inputs.env-file-name }}
        ENV_FILE_B64: ${{ steps.encode-env.outputs.b64 }}
      with:
        host: ${{ env.VPS_TAILSCALE_IP }}
        username: ${{ inputs.vps-user }}
        key: ${{ env.VPS_SSH_KEY }}
        envs: REPO_DIR,ENV_FILE_NAME,ENV_FILE_B64
        script: |
          set -euo pipefail
          TARGET="$REPO_DIR/$ENV_FILE_NAME"
          printf '%s' "$ENV_FILE_B64" | base64 -d > "$TARGET"
          chmod 600 "$TARGET"
          if [[ ! -s "$TARGET" ]]; then
            echo "::error::Env file is empty at $TARGET after decode." >&2
            exit 1
          fi
          echo "Wrote $TARGET ($(grep -c '=' "$TARGET") vars)."

    # ---------------------------------------------------------------------------
    # Pre-deploy DB backup (skipped when db-type=none or skip-pre-deploy=true)
    # ---------------------------------------------------------------------------

    - name: Pre-deploy DB backup
      if: ${{ inputs.db-type != 'none' && inputs.skip-pre-deploy != 'true' }}
      uses: appleboy/ssh-action@v1.2.0
      env:
        DB_TYPE: ${{ inputs.db-type }}
        DB_CONTAINER: ${{ inputs.db-container }}
        DB_PATH: ${{ inputs.db-path }}
        DB_NAME: ${{ inputs.db-name }}
        DB_USER: ${{ inputs.db-user }}
        REPO_DIR: ${{ inputs.repo-dir }}
        SNAPSHOT_DIR: ${{ inputs.snapshot-dir }}
        RETENTION_DAYS: ${{ inputs.snapshot-retention-days }}
      with:
        host: ${{ env.VPS_TAILSCALE_IP }}
        username: ${{ inputs.vps-user }}
        key: ${{ env.VPS_SSH_KEY }}
        envs: DB_TYPE,DB_CONTAINER,DB_PATH,DB_NAME,DB_USER,REPO_DIR,SNAPSHOT_DIR,RETENTION_DAYS
        command_timeout: 5m
        script: |
          set -euo pipefail

          if [[ -z "$DB_CONTAINER" ]]; then
            echo "::error::db-type=$DB_TYPE requires db-container." >&2
            exit 1
          fi

          # First deploy / recovery: DB container not up yet → skip cleanly.
          if ! docker ps --format '{{.Names}}' | grep -qx "$DB_CONTAINER"; then
            echo "DB container '$DB_CONTAINER' not running — first deploy or recovery. Skipping backup."
            exit 0
          fi

          TS=$(date -u +%Y%m%dT%H%M%SZ)

          case "$DB_TYPE" in
            sqlite)
              if [[ -z "$DB_PATH" ]]; then
                echo "::error::db-type=sqlite requires db-path." >&2
                exit 1
              fi
              # Snapshot dir lives INSIDE the container on the data volume.
              SNAP_DIR="${SNAPSHOT_DIR:-$(dirname "$DB_PATH")/pre-deploy-snapshots}"
              echo "SQLite integrity-check + WAL-safe snapshot of $DB_PATH → $SNAP_DIR (container $DB_CONTAINER)"
              docker exec -i -e DB_PATH="$DB_PATH" -e SNAP_DIR="$SNAP_DIR" -e TS="$TS" -e RETENTION_DAYS="$RETENTION_DAYS" "$DB_CONTAINER" python - <<'PYEOF'
          import sqlite3, os, time
          db = os.environ["DB_PATH"]; snap_dir = os.environ["SNAP_DIR"]
          ts = os.environ["TS"]; retention = int(os.environ["RETENTION_DAYS"])
          src = sqlite3.connect(db)
          integ = src.execute("PRAGMA integrity_check").fetchone()[0]
          print("main_integrity:", integ)
          assert integ == "ok", f"Main DB integrity failed: {integ}"
          os.makedirs(snap_dir, exist_ok=True)
          src.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          snap = os.path.join(snap_dir, f"pre-deploy-{ts}.db")
          dst = sqlite3.connect(snap); src.backup(dst)
          snap_integ = dst.execute("PRAGMA integrity_check").fetchone()[0]
          print("snap_integrity:", snap_integ)
          assert snap_integ == "ok", f"Snapshot integrity failed: {snap_integ}"
          dst.close(); src.close(); print("snapshot:", snap)
          cutoff = time.time() - retention * 86400; pruned = 0
          for f in os.listdir(snap_dir):
              if f.startswith("pre-deploy-") and f.endswith(".db"):
                  p = os.path.join(snap_dir, f)
                  if os.stat(p).st_mtime < cutoff:
                      os.remove(p); pruned += 1
          print("pruned:", pruned)
          PYEOF
              ;;
            postgres)
              if [[ -z "$DB_NAME" || -z "$DB_USER" ]]; then
                echo "::error::db-type=postgres requires db-name and db-user." >&2
                exit 1
              fi
              # Snapshot dir lives on the VPS HOST under repo-dir.
              SNAP_DIR="${SNAPSHOT_DIR:-$REPO_DIR/pre-deploy-snapshots}"
              mkdir -p "$SNAP_DIR"
              echo "Postgres pg_isready + pg_dump of $DB_NAME → $SNAP_DIR (container $DB_CONTAINER)"
              docker exec "$DB_CONTAINER" pg_isready -U "$DB_USER" -d "$DB_NAME"
              SNAP="$SNAP_DIR/pre-deploy-$TS.sql.gz"
              docker exec "$DB_CONTAINER" pg_dump -U "$DB_USER" "$DB_NAME" | gzip > "$SNAP"
              if [[ ! -s "$SNAP" ]]; then
                echo "::error::pg_dump produced an empty snapshot at $SNAP." >&2
                exit 1
              fi
              echo "snapshot: $SNAP ($(du -h "$SNAP" | cut -f1))"
              find "$SNAP_DIR" -name 'pre-deploy-*.sql.gz' -mtime "+$RETENTION_DAYS" -delete
              echo "pruned snapshots older than ${RETENTION_DAYS}d"
              ;;
            *)
              echo "::error::Unknown db-type '$DB_TYPE' (expected sqlite|postgres|none)." >&2
              exit 1
              ;;
          esac

    # ---------------------------------------------------------------------------
    # Pre-compose-up hook (additive — skipped when input is empty)
    # Runs AFTER env-file write + pre-deploy DB backup, BEFORE compose up.
    # Deploy callers omit this → skipped → no behavior change.
    # ---------------------------------------------------------------------------

    - name: Run pre-compose-up script on VPS
      if: ${{ inputs.pre-compose-up-script != '' }}
      uses: appleboy/ssh-action@v1.2.0
      env:
        REPO_DIR: ${{ inputs.repo-dir }}
        PRE_COMPOSE_SCRIPT: ${{ inputs.pre-compose-up-script }}
      with:
        host: ${{ env.VPS_TAILSCALE_IP }}
        username: ${{ inputs.vps-user }}
        key: ${{ env.VPS_SSH_KEY }}
        envs: REPO_DIR,PRE_COMPOSE_SCRIPT
        command_timeout: 10m
        script: |
          set -euo pipefail
          cd "$REPO_DIR"
          eval "$PRE_COMPOSE_SCRIPT"

    # ---------------------------------------------------------------------------
    # Docker Compose up + healthcheck
    # ---------------------------------------------------------------------------

    - name: Docker Compose up on VPS
      uses: appleboy/ssh-action@v1.2.0
      env:
        REPO_DIR: ${{ inputs.repo-dir }}
        COMPOSE_FILE: ${{ inputs.compose-file }}
        ENV_FILE_NAME: ${{ inputs.env-file-name }}
        COMPOSE_BUILD: ${{ inputs.compose-build }}
        COMPOSE_FORCE_RECREATE: ${{ inputs.compose-force-recreate }}
      with:
        host: ${{ env.VPS_TAILSCALE_IP }}
        username: ${{ inputs.vps-user }}
        key: ${{ env.VPS_SSH_KEY }}
        envs: REPO_DIR,COMPOSE_FILE,ENV_FILE_NAME,COMPOSE_BUILD,COMPOSE_FORCE_RECREATE
        script: |
          set -euo pipefail
          cd "$REPO_DIR"

          UP_FLAGS=(-d)
          [[ "$COMPOSE_BUILD" == "true" ]] && UP_FLAGS+=(--build)
          [[ "$COMPOSE_FORCE_RECREATE" == "true" ]] && UP_FLAGS+=(--force-recreate)

          echo "Starting services: compose=$COMPOSE_FILE env=$ENV_FILE_NAME flags=${UP_FLAGS[*]}"
          if [[ "$COMPOSE_BUILD" != "true" ]]; then
            docker compose --env-file "$ENV_FILE_NAME" -f "$COMPOSE_FILE" pull
          fi
          docker compose --env-file "$ENV_FILE_NAME" -f "$COMPOSE_FILE" up "${UP_FLAGS[@]}"

    - name: Wait for containers to become healthy
      uses: appleboy/ssh-action@v1.2.0
      env:
        REPO_DIR: ${{ inputs.repo-dir }}
        COMPOSE_FILE: ${{ inputs.compose-file }}
        ENV_FILE_NAME: ${{ inputs.env-file-name }}
        HEALTHCHECK_CONTAINERS: ${{ inputs.healthcheck-containers }}
      with:
        host: ${{ env.VPS_TAILSCALE_IP }}
        username: ${{ inputs.vps-user }}
        key: ${{ env.VPS_SSH_KEY }}
        envs: REPO_DIR,COMPOSE_FILE,ENV_FILE_NAME,HEALTHCHECK_CONTAINERS
        command_timeout: 5m
        script: |
          set -euo pipefail
          # Pinned to v2 — same major as the shared workflows. Do NOT use
          # github.ref_name here (resolves to the caller's ref in a reusable
          # workflow, not this repo's tag).
          curl -fsSL \
            "https://raw.githubusercontent.com/aretecp/github-actions/v2/scripts/wait-for-healthy.sh" \
            | COMPOSE_FILE="$REPO_DIR/$COMPOSE_FILE" \
              ENV_FILE="$REPO_DIR/$ENV_FILE_NAME" \
              bash -s -- $HEALTHCHECK_CONTAINERS
