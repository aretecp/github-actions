name: AWS deploy core
description: >-
  Assume an AWS role via OIDC, resolve the target's resource names from SSM,
  deploy, and wait for the deploy to actually be live. Strategy is chosen by the
  `target` input. Mirrors vps-deploy-core: one implementation, thin callers.

  This action does NOT build. The build is npm, pnpm, docker or uv depending on
  the app, so it stays with the caller — which is the only thing keeping the
  input surface here from growing the way deploy-vps-shared's did.

inputs:
  target:
    description: >-
      Deploy strategy: `s3-cloudfront`, `ec2-compose` or `ecs-service`.
      `lambda-image` is next.
    required: true

  aws-role-arn:
    description: 'IAM role to assume via GitHub OIDC. The caller needs `id-token: write`.'
    required: true

  aws-region:
    description: AWS region.
    required: false
    default: us-east-1

  ssm-prefix:
    description: >-
      SSM parameter path prefix holding this app+env's resource names, e.g.
      `/arete-intelligence-site/prod`. Terraform writes these, so they cannot
      drift from the resources they name — which is why config comes from here
      rather than from repository variables with hardcoded fallbacks.

      Required for `s3-cloudfront` and `ecs-service`. Unused by `ec2-compose`,
      which is handed its instance id directly.
    required: false
    default: ''

  dry-run:
    description: >-
      Resolve config and report what would happen, then stop before mutating
      anything. `true` still assumes the role and reads SSM.
    required: false
    default: 'false'

  # ── s3-cloudfront ────────────────────────────────────────────────────────
  source-dir:
    description: 's3-cloudfront: built directory to sync, e.g. `out` or `dist`.'
    required: false
    default: ''

  delete-removed:
    description: >-
      s3-cloudfront: pass --delete to `aws s3 sync`, so files absent locally are
      removed from the bucket. Leave true unless the bucket holds objects the
      build does not produce.
    required: false
    default: 'true'

  # ── ec2-compose ──────────────────────────────────────────────────────────
  instance-id:
    description: 'ec2-compose: EC2 instance to deploy to. It needs the SSM agent and an instance profile with AmazonSSMManagedInstanceCore.'
    required: false
    default: ''

  repo-dir:
    description: >-
      ec2-compose: absolute working directory on the host — where the
      compose files land and the rendered dotenv gets written. No longer a
      git checkout; the name stays for now since it's the only thing every
      caller already knows.
    required: false
    default: ''

  compose-file:
    description: >-
      ec2-compose: compose file(s) to bring up, relative to repo-dir.
      Space-separated for an override stack, in precedence order — e.g.
      `docker-compose.yml docker-compose.aws.yml`.
    required: false
    default: docker-compose.yml

  compose-profiles:
    description: 'ec2-compose: space-separated compose profiles to enable.'
    required: false
    default: ''

  image:
    description: >-
      ec2-compose, ecs-service: full pre-built image reference to deploy, e.g.
      `<account>.dkr.ecr.<region>.amazonaws.com/lumios:v6.17.1`. The caller
      builds and pushes this itself, same as source-dir for s3-cloudfront —
      this action does not build. ec2-compose's host authenticates to ECR with
      its own instance role and pulls; no git, no Dockerfile, no source ever
      touches the host.
    required: false
    default: ''

  env-parameter-name:
    description: >-
      ec2-compose: SSM SecureString parameter holding the rendered dotenv. The
      caller writes it; the host reads it with its own instance role. It is NOT
      passed through SendCommand, whose parameters are retained on the command
      record and copied into CloudWatch.
    required: false
    default: ''

  env-file-path:
    description: >-
      ec2-compose: local path to the rendered dotenv to upload to
      env-parameter-name. ecs-service: local path to upload to the S3 object
      at env-file-s3-uri (resolved from SSM). Omit either way to reuse
      whatever destination already holds.
    required: false
    default: ''

  env-file-name:
    description: 'ec2-compose: filename to write the dotenv as on the host, relative to repo-dir.'
    required: false
    default: .env

  healthcheck-url:
    description: >-
      ec2-compose: URL curled on the host after compose up. ecs-service: URL
      curled from the runner after the service stabilizes. Empty skips the
      check either way.
    required: false
    default: ''

  command-timeout:
    description: 'ec2-compose: seconds to wait for the remote command. A cold image build outlasts the default easily.'
    required: false
    default: '1800'

  # ── ecs-service ──────────────────────────────────────────────────────────
  container-name:
    description: >-
      ecs-service: name of the container definition to point at `image`
      within the current task definition (`ecs-task-family`, from SSM). The
      rest of the task definition — roles, network mode, volumes, sizing —
      is carried over unchanged from the revision Terraform registered.
    required: false
    default: ''

  migrate-command:
    description: >-
      ecs-service: command to run as a one-off gating task, on the new task
      definition revision, before `update-service` — e.g. `/app/bin/migrate`.
      Space-separated. Empty skips the gate; a nonzero exit fails the deploy
      before any traffic reaches the new revision.
    required: false
    default: ''

  post-deploy-command:
    description: >-
      ecs-service: command to run as a one-off task after the service
      reaches steady state — e.g. an app's own post-deploy sync task. Space-
      separated. Empty skips it. Intentionally generic: this action carries
      no app-specific business logic, the same reason healthcheck-url is
      just a URL and not a per-app health contract.
    required: false
    default: ''

  task-timeout:
    description: >-
      ecs-service: seconds to wait for the migrate/post-deploy one-off tasks
      to stop. Separate from command-timeout (ec2-compose's SSM command
      budget) because these are two different wait mechanisms on two
      different targets.
    required: false
    default: '600'

  invalidation-paths:
    description: 's3-cloudfront: space-separated CloudFront paths to invalidate.'
    required: false
    default: '/*'

  wait-for-invalidation:
    description: >-
      s3-cloudfront: block until the invalidation completes. On by default,
      because a job that goes green while the edge still serves the old bundle
      is a deploy that reports success it has not achieved.
    required: false
    default: 'true'

outputs:
  bucket:
    description: 's3-cloudfront: the bucket that was synced.'
    value: ${{ steps.resolve.outputs.bucket }}
  distribution-id:
    description: 's3-cloudfront: the distribution that was invalidated.'
    value: ${{ steps.resolve.outputs.distribution_id }}
  invalidation-id:
    description: 's3-cloudfront: the invalidation that was created.'
    value: ${{ steps.invalidate.outputs.invalidation_id }}
  command-id:
    description: 'ec2-compose: the SSM command that was sent.'
    value: ${{ steps.send.outputs.command_id }}
  task-definition-arn:
    description: 'ecs-service: the task definition revision that was registered and deployed.'
    value: ${{ steps.register-task-def.outputs.task_definition_arn }}

runs:
  using: composite
  steps:
    # ── 1. Validate, before anything touches AWS ─────────────────────────────
    # deploy-prod.yml in lumios is the cautionary tale: a missing key failed five
    # consecutive prod deploys forty lines into an ssh step, and nobody noticed
    # for three weeks, because a pipeline that fails safely looks like nothing
    # changed. Fail here, by name, with nothing half-done behind it.
    - name: Validate inputs for the selected target
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        SOURCE_DIR: ${{ inputs.source-dir }}
        SSM_PREFIX: ${{ inputs.ssm-prefix }}
        INSTANCE_ID: ${{ inputs.instance-id }}
        REPO_DIR: ${{ inputs.repo-dir }}
        IMAGE: ${{ inputs.image }}
        ENV_PARAMETER_NAME: ${{ inputs.env-parameter-name }}
        ENV_FILE_PATH: ${{ inputs.env-file-path }}
        CONTAINER_NAME: ${{ inputs.container-name }}
      run: |
        set -euo pipefail

        case "$TARGET" in
          s3-cloudfront)
            case "$SSM_PREFIX" in
              /*) ;;
              *) echo "::error::target=s3-cloudfront requires ssm-prefix starting with '/': got '$SSM_PREFIX'" >&2; exit 1 ;;
            esac
            if [ -z "$SOURCE_DIR" ]; then
              echo "::error::target=s3-cloudfront requires source-dir." >&2
              exit 1
            fi
            if [ ! -d "$SOURCE_DIR" ]; then
              echo "::error::source-dir '$SOURCE_DIR' does not exist. Did the build step run, and does it output here?" >&2
              exit 1
            fi
            if [ -z "$(ls -A "$SOURCE_DIR")" ]; then
              echo "::error::source-dir '$SOURCE_DIR' is empty. Refusing to sync — with --delete this would empty the bucket." >&2
              exit 1
            fi
            ;;
          ec2-compose)
            missing=()
            [ -z "${INSTANCE_ID:-}" ] && missing+=(instance-id)
            [ -z "${REPO_DIR:-}" ] && missing+=(repo-dir)
            [ -z "${IMAGE:-}" ] && missing+=(image)
            [ -z "${ENV_PARAMETER_NAME:-}" ] && missing+=(env-parameter-name)
            if (( ${#missing[@]} )); then
              echo "::error::target=ec2-compose requires: ${missing[*]}" >&2
              exit 1
            fi
            case "$REPO_DIR" in
              /*) ;;
              *) echo "::error::repo-dir must be absolute: got '$REPO_DIR'" >&2; exit 1 ;;
            esac
            if [ -n "${ENV_FILE_PATH:-}" ] && [ ! -s "$ENV_FILE_PATH" ]; then
              echo "::error::env-file-path '$ENV_FILE_PATH' is missing or empty. Did the Infisical render step run?" >&2
              exit 1
            fi
            ;;
          ecs-service)
            case "$SSM_PREFIX" in
              /*) ;;
              *) echo "::error::target=ecs-service requires ssm-prefix starting with '/': got '$SSM_PREFIX'" >&2; exit 1 ;;
            esac
            missing=()
            [ -z "${IMAGE:-}" ] && missing+=(image)
            [ -z "${CONTAINER_NAME:-}" ] && missing+=(container-name)
            if (( ${#missing[@]} )); then
              echo "::error::target=ecs-service requires: ${missing[*]}" >&2
              exit 1
            fi
            if [ -n "${ENV_FILE_PATH:-}" ] && [ ! -s "$ENV_FILE_PATH" ]; then
              echo "::error::env-file-path '$ENV_FILE_PATH' is missing or empty. Did the Infisical render step run?" >&2
              exit 1
            fi
            ;;
          lambda-image)
            echo "::error::target '$TARGET' is not implemented yet." >&2
            exit 1
            ;;
          *)
            echo "::error::Unknown target '$TARGET'. Supported: s3-cloudfront, ec2-compose, ecs-service." >&2
            exit 1
            ;;
        esac

        echo "target=$TARGET validated"

    # Passing an input that belongs to a different target means the caller
    # believes something is happening that isn't. Silently ignoring it is how a
    # deploy does the wrong thing and still reports success.
    - name: Reject inputs from other targets
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        SOURCE_DIR: ${{ inputs.source-dir }}
        INSTANCE_ID: ${{ inputs.instance-id }}
        CONTAINER_NAME: ${{ inputs.container-name }}
        MIGRATE_COMMAND: ${{ inputs.migrate-command }}
        POST_DEPLOY_COMMAND: ${{ inputs.post-deploy-command }}
      run: |
        set -euo pipefail
        if [ "$TARGET" != "s3-cloudfront" ] && [ -n "$SOURCE_DIR" ]; then
          echo "::error::source-dir belongs to target=s3-cloudfront, but target=$TARGET." >&2
          exit 1
        fi
        if [ "$TARGET" != "ec2-compose" ] && [ -n "$INSTANCE_ID" ]; then
          echo "::error::instance-id belongs to target=ec2-compose, but target=$TARGET." >&2
          exit 1
        fi
        if [ "$TARGET" != "ecs-service" ] && [ -n "$CONTAINER_NAME" ]; then
          echo "::error::container-name belongs to target=ecs-service, but target=$TARGET." >&2
          exit 1
        fi
        if [ "$TARGET" != "ecs-service" ] && [ -n "$MIGRATE_COMMAND" ]; then
          echo "::error::migrate-command belongs to target=ecs-service, but target=$TARGET." >&2
          exit 1
        fi
        if [ "$TARGET" != "ecs-service" ] && [ -n "$POST_DEPLOY_COMMAND" ]; then
          echo "::error::post-deploy-command belongs to target=ecs-service, but target=$TARGET." >&2
          exit 1
        fi

    # ── 2. Assume the role ───────────────────────────────────────────────────
    # Used directly rather than wrapped. It is one library call, and a wrapper
    # would only add a layer to read through when auth breaks.
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}

    # ── 3. Resolve resource names from SSM ───────────────────────────────────
    - name: Resolve deploy targets from SSM
      id: resolve
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        SSM_PREFIX: ${{ inputs.ssm-prefix }}
        AWS_REGION: ${{ inputs.aws-region }}
      run: |
        set -euo pipefail

        get_param() {
          local name="$SSM_PREFIX/$1"
          local value
          if ! value=$(aws ssm get-parameter --name "$name" \
                        --query 'Parameter.Value' --output text \
                        --region "$AWS_REGION" 2>/dev/null); then
            echo "::error::SSM parameter '$name' not found. Terraform writes these — has the app's workspace been applied in this environment?" >&2
            return 1
          fi
          if [ -z "$value" ] || [ "$value" = "None" ]; then
            echo "::error::SSM parameter '$name' is empty." >&2
            return 1
          fi
          printf '%s' "$value"
        }

        if [ "$TARGET" = "s3-cloudfront" ]; then
          bucket=$(get_param s3-bucket-name)
          distribution_id=$(get_param cloudfront-distribution-id)
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$distribution_id" >> "$GITHUB_OUTPUT"
          {
            echo "### AWS deploy target"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Bucket | \`$bucket\` |"
            echo "| Distribution | \`$distribution_id\` |"
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        if [ "$TARGET" = "ecs-service" ]; then
          cluster=$(get_param ecs-cluster-name)
          service=$(get_param ecs-service-name)
          task_family=$(get_param ecs-task-family)
          env_file_s3_uri=$(get_param env-file-s3-uri)
          echo "cluster=$cluster" >> "$GITHUB_OUTPUT"
          echo "service=$service" >> "$GITHUB_OUTPUT"
          echo "task_family=$task_family" >> "$GITHUB_OUTPUT"
          echo "env_file_s3_uri=$env_file_s3_uri" >> "$GITHUB_OUTPUT"
          {
            echo "### AWS deploy target"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Cluster | \`$cluster\` |"
            echo "| Service | \`$service\` |"
            echo "| Task family | \`$task_family\` |"
          } >> "$GITHUB_STEP_SUMMARY"
        fi

    # ── 4. Deploy ────────────────────────────────────────────────────────────
    - name: Sync to S3
      if: ${{ inputs.target == 's3-cloudfront' }}
      shell: bash
      env:
        SOURCE_DIR: ${{ inputs.source-dir }}
        BUCKET: ${{ steps.resolve.outputs.bucket }}
        DELETE_REMOVED: ${{ inputs.delete-removed }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail
        args=()
        [ "$DELETE_REMOVED" = "true" ] && args+=(--delete)
        [ "$DRY_RUN" = "true" ] && args+=(--dryrun)
        aws s3 sync "$SOURCE_DIR/" "s3://$BUCKET" "${args[@]}"

    - name: Invalidate CloudFront
      id: invalidate
      if: ${{ inputs.target == 's3-cloudfront' && inputs.dry-run != 'true' }}
      shell: bash
      env:
        DISTRIBUTION_ID: ${{ steps.resolve.outputs.distribution_id }}
        PATHS: ${{ inputs.invalidation-paths }}
      run: |
        set -euo pipefail
        # noglob before splitting. The default path is /*, which bash would
        # expand against the runner's filesystem into /bin /dev /etc ... and
        # invalidate a list of paths nobody asked for.
        set -f
        read -ra paths <<< "$PATHS"
        id=$(aws cloudfront create-invalidation \
              --distribution-id "$DISTRIBUTION_ID" \
              --paths "${paths[@]}" \
              --query 'Invalidation.Id' --output text)
        echo "invalidation_id=$id" >> "$GITHUB_OUTPUT"
        echo "Invalidation $id created for $PATHS"

    # ── 5. Wait for it to actually be live ───────────────────────────────────
    # The step this replaces fired the invalidation and exited. The job went
    # green while the edge still served the previous bundle, so "deployed" and
    # "reported deployed" were different things by several minutes.
    - name: Wait for the invalidation to complete
      if: ${{ inputs.target == 's3-cloudfront' && inputs.dry-run != 'true' && inputs.wait-for-invalidation == 'true' }}
      shell: bash
      env:
        DISTRIBUTION_ID: ${{ steps.resolve.outputs.distribution_id }}
        INVALIDATION_ID: ${{ steps.invalidate.outputs.invalidation_id }}
      run: |
        set -euo pipefail
        aws cloudfront wait invalidation-completed \
          --distribution-id "$DISTRIBUTION_ID" \
          --id "$INVALIDATION_ID"
        echo "Invalidation $INVALIDATION_ID completed."

    # ── 6. ec2-compose ───────────────────────────────────────────────────────
    # SSM rather than ssh over a tailnet: the instance profile already carries
    # AmazonSSMManagedInstanceCore, so there is no auth key to hold, no inbound
    # port to open, and no long-lived credential anywhere in the path.
    - name: Upload the rendered dotenv to Parameter Store
      if: ${{ inputs.target == 'ec2-compose' && inputs.env-file-path != '' && inputs.dry-run != 'true' }}
      shell: bash
      env:
        ENV_PARAMETER_NAME: ${{ inputs.env-parameter-name }}
        ENV_FILE_PATH: ${{ inputs.env-file-path }}
      run: |
        set -euo pipefail
        # --overwrite, and the value read from a file rather than argv, so the
        # env never appears in a process list on the runner.
        aws ssm put-parameter \
          --name "$ENV_PARAMETER_NAME" \
          --type SecureString \
          --value "file://$ENV_FILE_PATH" \
          --overwrite >/dev/null
        echo "Wrote $(wc -l < "$ENV_FILE_PATH") lines to $ENV_PARAMETER_NAME"

    - name: Deploy over SSM
      id: send
      if: ${{ inputs.target == 'ec2-compose' && inputs.dry-run != 'true' }}
      shell: bash
      env:
        INSTANCE_ID: ${{ inputs.instance-id }}
        REPO_DIR: ${{ inputs.repo-dir }}
        IMAGE: ${{ inputs.image }}
        COMPOSE_FILE: ${{ inputs.compose-file }}
        COMPOSE_PROFILES_LIST: ${{ inputs.compose-profiles }}
        AWS_REGION: ${{ inputs.aws-region }}
        ENV_PARAMETER_NAME: ${{ inputs.env-parameter-name }}
        ENV_FILE_NAME: ${{ inputs.env-file-name }}
        HEALTHCHECK_URL: ${{ inputs.healthcheck-url }}
        COMMAND_TIMEOUT: ${{ inputs.command-timeout }}
        RUNNER_CHECKOUT_DIR: ${{ github.workspace }}
        DEPLOY_SCRIPT: ${{ github.action_path }}/scripts/ec2-compose-deploy.sh
      run: |
        set -euo pipefail

        # Every value the host script needs is a plain `export NAME='value'`
        # line — the same mechanism already proven safe all through this
        # action, never a generated shell snippet. COMPOSE_B64_<i> is
        # positional: both here and in ec2-compose-deploy.sh, i is just the
        # index of `for f in $COMPOSE_FILE` — no name-derivation to keep in
        # sync between the two, just "iterate the same list the same way."
        {
          echo "export REPO_DIR='$REPO_DIR'"
          echo "export IMAGE='$IMAGE'"
          echo "export COMPOSE_FILE='$COMPOSE_FILE'"
          echo "export COMPOSE_PROFILES_LIST='$COMPOSE_PROFILES_LIST'"
          echo "export AWS_REGION='$AWS_REGION'"
          echo "export ENV_PARAMETER_NAME='$ENV_PARAMETER_NAME'"
          echo "export ENV_FILE_NAME='$ENV_FILE_NAME'"
          echo "export HEALTHCHECK_URL='$HEALTHCHECK_URL'"
          i=0
          for f in $COMPOSE_FILE; do
            path="$RUNNER_CHECKOUT_DIR/$f"
            if [ ! -s "$path" ]; then
              echo "::error::compose-file '$f' not found in the checkout at $path." >&2
              exit 1
            fi
            echo "export COMPOSE_B64_${i}='$(base64 -w0 "$path")'"
            i=$((i + 1))
          done
          cat "$DEPLOY_SCRIPT"
        } > /tmp/remote.sh

        # jq --rawfile, not string interpolation: a quote or a newline
        # anywhere in remote.sh cannot break out of the parameters document.
        jq -n --rawfile script /tmp/remote.sh \
          '{commands: ($script | split("\n"))}' > /tmp/params.json

        # comment is capped at 100 chars by SSM; a full ECR URI blows past
        # that, so only the tag goes in -- still the meaningful part.
        command_id=$(aws ssm send-command \
          --instance-ids "$INSTANCE_ID" \
          --document-name AWS-RunShellScript \
          --comment "deploy ${IMAGE##*:}" \
          --timeout-seconds "$COMMAND_TIMEOUT" \
          --parameters "file:///tmp/params.json" \
          --query 'Command.CommandId' --output text)
        echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
        echo "SSM command $command_id sent to $INSTANCE_ID"

    # `aws ssm wait command-executed` gives up after ~100s, which a cold image
    # build outlasts every time. Poll on the caller's own timeout instead.
    - name: Wait for the deploy and surface its output
      if: ${{ inputs.target == 'ec2-compose' && inputs.dry-run != 'true' }}
      shell: bash
      env:
        INSTANCE_ID: ${{ inputs.instance-id }}
        COMMAND_ID: ${{ steps.send.outputs.command_id }}
        COMMAND_TIMEOUT: ${{ inputs.command-timeout }}
      run: |
        set -euo pipefail
        deadline=$(( SECONDS + COMMAND_TIMEOUT ))
        status=Pending

        while [ "$SECONDS" -lt "$deadline" ]; do
          status=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query Status --output text)
          case "$status" in
            Success|Failed|Cancelled|TimedOut) break ;;
          esac
          sleep 10
        done

        # Always print both streams. A deploy that fails silently is the failure
        # mode this whole action exists to avoid.
        aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
          --query StandardOutputContent --output text
        err=$(aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
          --query StandardErrorContent --output text)
        [ -n "$err" ] && [ "$err" != "None" ] && echo "--- stderr ---" && echo "$err" >&2

        if [ "$status" != "Success" ]; then
          echo "::error::SSM command $COMMAND_ID finished as $status." >&2
          exit 1
        fi
        echo "Deploy succeeded."

    # ── 7. ecs-service ───────────────────────────────────────────────────────
    - name: Upload the rendered dotenv to S3
      if: ${{ inputs.target == 'ecs-service' && inputs.env-file-path != '' && inputs.dry-run != 'true' }}
      shell: bash
      env:
        ENV_FILE_S3_URI: ${{ steps.resolve.outputs.env_file_s3_uri }}
        ENV_FILE_PATH: ${{ inputs.env-file-path }}
      run: |
        set -euo pipefail
        aws s3 cp "$ENV_FILE_PATH" "$ENV_FILE_S3_URI"
        echo "Wrote $(wc -l < "$ENV_FILE_PATH") lines to $ENV_FILE_S3_URI"

    # Only the named container's image changes; roles, network mode, sizing
    # and volumes carry over from whatever Terraform last applied.
    - name: Register new task definition revision
      id: register-task-def
      if: ${{ inputs.target == 'ecs-service' && inputs.dry-run != 'true' }}
      shell: bash
      env:
        TASK_FAMILY: ${{ steps.resolve.outputs.task_family }}
        CONTAINER_NAME: ${{ inputs.container-name }}
        IMAGE: ${{ inputs.image }}
      run: |
        set -euo pipefail

        aws ecs describe-task-definition --task-definition "$TASK_FAMILY" \
          --query 'taskDefinition' > /tmp/current-task-def.json

        # Deny-list so a future task-def field (ephemeralStorage, proxyConfiguration, ...) survives unless named here.
        jq --arg name "$CONTAINER_NAME" --arg image "$IMAGE" '
          .containerDefinitions |= map(if .name == $name then .image = $image else . end) |
          del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
              .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
        ' /tmp/current-task-def.json > /tmp/new-task-def.json

        if ! jq -e --arg name "$CONTAINER_NAME" \
          '.containerDefinitions[] | select(.name == $name)' /tmp/new-task-def.json > /dev/null; then
          echo "::error::container-name '$CONTAINER_NAME' not found in task family '$TASK_FAMILY'." >&2
          exit 1
        fi

        task_definition_arn=$(aws ecs register-task-definition \
          --cli-input-json file:///tmp/new-task-def.json \
          --query 'taskDefinition.taskDefinitionArn' --output text)
        echo "task_definition_arn=$task_definition_arn" >> "$GITHUB_OUTPUT"
        echo "Registered $task_definition_arn"

    # Reused from the running service so a one-off task always shares its
    # network path — not a new input to keep in sync with the service.
    - name: Resolve the service's network configuration
      id: network-config
      if: ${{ inputs.target == 'ecs-service' && inputs.dry-run != 'true' && (inputs.migrate-command != '' || inputs.post-deploy-command != '') }}
      shell: bash
      env:
        CLUSTER: ${{ steps.resolve.outputs.cluster }}
        SERVICE: ${{ steps.resolve.outputs.service }}
      run: |
        set -euo pipefail
        config=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
          --query 'services[0].networkConfiguration' --output json)
        if [ "$config" = "null" ]; then
          echo "::error::service '$SERVICE' has no networkConfiguration — awsvpc mode expected." >&2
          exit 1
        fi
        {
          echo "config<<ECS_NETWORK_CONFIG_EOF"
          echo "$config"
          echo "ECS_NETWORK_CONFIG_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Run gating migration task
      if: ${{ inputs.target == 'ecs-service' && inputs.migrate-command != '' && inputs.dry-run != 'true' }}
      shell: bash
      env:
        CLUSTER: ${{ steps.resolve.outputs.cluster }}
        TASK_DEFINITION_ARN: ${{ steps.register-task-def.outputs.task_definition_arn }}
        CONTAINER_NAME: ${{ inputs.container-name }}
        COMMAND: ${{ inputs.migrate-command }}
        NETWORK_CONFIGURATION: ${{ steps.network-config.outputs.config }}
        TASK_TIMEOUT: ${{ inputs.task-timeout }}
        LABEL: migrate
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/scripts/ecs-run-task.sh"

    # After the gating migration, not before: a failed migration should never
    # point the service at the revision it failed on.
    - name: Update the ECS service
      if: ${{ inputs.target == 'ecs-service' && inputs.dry-run != 'true' }}
      shell: bash
      env:
        CLUSTER: ${{ steps.resolve.outputs.cluster }}
        SERVICE: ${{ steps.resolve.outputs.service }}
        TASK_DEFINITION_ARN: ${{ steps.register-task-def.outputs.task_definition_arn }}
      run: |
        set -euo pipefail
        aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
          --task-definition "$TASK_DEFINITION_ARN" >/dev/null
        echo "Service $SERVICE updated to $TASK_DEFINITION_ARN"

    - name: Wait for the service to stabilize
      if: ${{ inputs.target == 'ecs-service' && inputs.dry-run != 'true' }}
      shell: bash
      env:
        CLUSTER: ${{ steps.resolve.outputs.cluster }}
        SERVICE: ${{ steps.resolve.outputs.service }}
      run: |
        set -euo pipefail
        aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
        echo "Service $SERVICE stable."

    - name: Run post-deploy task
      if: ${{ inputs.target == 'ecs-service' && inputs.post-deploy-command != '' && inputs.dry-run != 'true' }}
      shell: bash
      env:
        CLUSTER: ${{ steps.resolve.outputs.cluster }}
        TASK_DEFINITION_ARN: ${{ steps.register-task-def.outputs.task_definition_arn }}
        CONTAINER_NAME: ${{ inputs.container-name }}
        COMMAND: ${{ inputs.post-deploy-command }}
        NETWORK_CONFIGURATION: ${{ steps.network-config.outputs.config }}
        TASK_TIMEOUT: ${{ inputs.task-timeout }}
        LABEL: post-deploy
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/scripts/ecs-run-task.sh"

    - name: Healthcheck
      if: ${{ inputs.target == 'ecs-service' && inputs.healthcheck-url != '' && inputs.dry-run != 'true' }}
      shell: bash
      env:
        HEALTHCHECK_URL: ${{ inputs.healthcheck-url }}
      run: |
        set -euo pipefail
        if ! curl -fsS --retry 5 --retry-delay 5 --retry-connrefused "$HEALTHCHECK_URL" >/dev/null; then
          echo "::error::Healthcheck failed: $HEALTHCHECK_URL" >&2
          exit 1
        fi
        echo "Healthcheck passed: $HEALTHCHECK_URL"
